# gitleaks configuration (Development Plan §5.3 gate 12). Default rules + narrowly scoped allowlists.
# Every allowlist entry must name the exact false positive and be reviewed (CODEOWNERS).
[extend]
useDefault = true

[[allowlists]]
description = "BRD API example: Idempotency-Key header sample value (documentation, not a secret)"
condition = "AND"
paths = ['''^docs/brd/Jadarat_TMS_BRD_v2\.md$''']
regexTarget = "line"
regexes = ['''Idempotency-Key: tms-enr-[0-9a-f]{6}''']

[[allowlists]]
description = "Sample invitation code K7M2PQ9XHT4W (and its typed form k7m2-pq9x-ht4w) in two unit tests (FR-IAM-03; fixtures, not secrets). Commit 47cdd60 holds them as `token: '…'` literals."
condition = "AND"
paths = ['''^apps/suite/src/lib/invite-accept-input\.test\.ts$''', '''^packages/platform-identity/src/invitation-accept\.test\.ts$''']
regexTarget = "line"
regexes = ['''token: '(K7M2PQ9XHT4W| k7m2-pq9x-ht4w )'''']

[[allowlists]]
description = "Fake provider keys and a fixed delivery id in e-mail unit tests (WP-ADM-01; fixtures, not secrets). Earlier commits of the e-mail work (e.g. aeba5d4, fe2cbbd, 04aa472) hold them as literals; the current files use low-entropy placeholders."
condition = "AND"
paths = ['''^apps/suite/src/lib/email-settings-form\.test\.ts$''', '''^packages/platform-notifications/src/jobs/(router|http-providers)\.test\.ts$''', '''^packages/platform-rbac/src/iam/email-integration\.test\.ts$''']
regexTarget = "line"
regexes = ['''(apiKey: '( re_abcdefgh123 |re_abcdefgh123|SG\.abcdefghij\.klmnopqrstuv|key-12345678)'|idempotencyKey: '5b0e7c39-6d4c-4d36-9d0a-1f0d1d6c0f11')''']

[[allowlists]]
description = "Fake cron secrets and a fake GitHub App installation token in worker-kick unit tests (ADR 0005 amendment; fixtures, not secrets). Commits bdda0da and 4fd0e20 hold them as literals; the current files use low-entropy placeholders."
condition = "AND"
paths = ['''^apps/suite/src/lib/(cron-jobs|server-settings)\.test\.ts$''', '''^packages/platform-jobs/src/kick/dispatch\.test\.ts$''']
regexTarget = "line"
regexes = ['''(const SECRET = 'cron-secret-0123456789abcdef';|CRON_SECRET: '0123456789abcdef0123'|const INSTALLATION_TOKEN = 'ghs_16C7e42F292c6912E7710c838347Ae178B4a';)''']
