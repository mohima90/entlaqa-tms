# Supabase CLI configuration for LOCAL development (`supabase start`) — minimal.
# Hosted projects are configured in the dashboard; self-hosted stacks via GoTrue env (T-M1-D04).
# No secrets in this file.
project_id = "jadarat-tms"

[api]
# ADR 0002 §5 / ADR 0003 §4: no Data API (PostgREST / pg_graphql). Server code reaches tenant data only
# through a direct connection (withUserTx); the browser uses Supabase only for Realtime. Auth, Storage and
# Realtime do not need PostgREST. Nothing is exposed — not even `public` (catalog test: public is empty).
# Enforced by `pnpm check:migrations` (scripts/lib/supabase-config.mjs).
enabled = false
port = 54321
schemas = []
extra_search_path = ["extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Same major as the staging project (PostgreSQL 17.11) and CI (postgres:17).
major_version = 17

[db.seed]
# Synthetic seed data only (migration-conventions.md §7); none yet.
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
# ADR 0003 §2: short-lived access tokens with refresh-token rotation and reuse detection.
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Accounts are created by invitation only (FR-IAM-03): sign-ups are OPEN in Auth so that an invitee can
# create their own account through the public API, and the before-user-created hook below refuses every
# sign-up without a valid invitation token for that e-mail (ADR 0002 §7 note T-M2-07, review H1). Never
# enable sign-ups without the hook.
enable_signup = true
# No anonymous sign-ins (the hook refuses them too).
enable_anonymous_sign_ins = false
# TODO(T-M1-D03): asymmetric signing keys for getClaims() (`supabase gen signing-key`), path kept out of git.

[auth.email]
enable_signup = true
# The invitation e-mail already proved the address: the sign-up returns a session at once (as on staging,
# "Confirm email" off, and self-hosted GOTRUE_MAILER_AUTOCONFIRM).
enable_confirmations = false
# Password reset (FR-IAM-13, T-M2-08; docs/engineering/password-reset.md): the e-mailed link is valid for
# 60 minutes and single use; one e-mail a minute per account. The link's token hash is
# sha224(e-mail + one-time code): with Auth's default 6-digit code it could be guessed (about 20 bits once
# the address is known), so the code has GoTrue's maximum length — 10 digits — although it is never shown.
otp_expiry = 3600
otp_length = 10
max_frequency = "60s"

# Who sends the reset e-mail is the web app's PASSWORD_RESET_DELIVERY (T-M2-17): `worker` (our
# notification service; the worker creates the token through Auth's admin API, Auth sends nothing) or
# `auth` (the default, kept as fallback) — then Auth sends this template. It links straight to our page
# with the token hash in the URL fragment; it never carries the code or Auth's own /verify link.
[auth.email.template.recovery]
subject = "إعادة تعيين كلمة المرور · Reset your password"
content_path = "./supabase/templates/recovery.html"

# The "password changed" notice is ours (worker, T-M2-17): Auth's own stays off here. (Hosted staging
# keeps Auth's ON, with this template, only while the web app runs with PASSWORD_RESET_DELIVERY=auth.)
[auth.email.notification.password_changed]
enabled = false
subject = "تغيّرت كلمة المرور · Your password was changed"
content_path = "./supabase/templates/password-changed.html"

[auth.sms]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# ADR 0002 §3: adds tenant_id/person_id for the session's active tenant (migration 20260930120400).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/custom_access_token_hook"

# Sign-up gate (FR-IAM-03, review H1, migration 20261009090000): only an e-mail sign-up carrying a valid
# invitation token for that e-mail creates an Auth user. Admin-created users (provisioning) skip it.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/private/before_user_created_hook"
