# Applies supabase/migrations to a hosted environment (T-M1-D03; runbook: docs/engineering/db-deploy.md).
# Manual only, from `main` only. Secrets live in the GitHub *environment* (Settings → Environments):
#   DATABASE_URL            migration connection (Supabase: role postgres via the session pooler, port 5432)
#   APP_SERVER_DB_PASSWORD  password for login role app_server (optional after the first run)
#   APP_WORKER_DB_PASSWORD  password for login role app_worker (optional after the first run)
# Run `plan` first (dry run, always rolled back), then `apply`.
name: DB deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging]
        default: staging
      mode:
        description: 'plan = dry run (rolled back) · apply = apply pending migrations'
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: db-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: DB deploy (${{ inputs.mode }} → ${{ inputs.environment }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          psql --version
      - name: Check required secrets are configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET: ${{ inputs.environment }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Secret DATABASE_URL is missing in environment '$TARGET' (docs/engineering/db-deploy.md)"
            exit 1
          fi
      - name: Migrations (${{ inputs.mode }})
        run: bash scripts/db-deploy.sh "$MODE"
        env:
          MODE: ${{ inputs.mode }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_SERVER_DB_PASSWORD: ${{ secrets.APP_SERVER_DB_PASSWORD }}
          APP_WORKER_DB_PASSWORD: ${{ secrets.APP_WORKER_DB_PASSWORD }}
