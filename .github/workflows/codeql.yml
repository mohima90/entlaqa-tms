# Gate 10 (Development Plan §5.3): SAST with CodeQL (security-extended queries).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: 'Gate 10 · SAST (CodeQL: ${{ matrix.language }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      # Worker-kick guard (security review H1, 21 Oct 2026; docs/engineering/background-jobs.md §1a): a run
      # (or re-run) started by the web app's GitHub App (vars.JOBS_KICK_ACTOR), or started by hand by any bot,
      # FAILS here rather than being skipped — a skipped required check would count as passed.
      - name: Refuse a start by the worker-kick app or another bot
        if: github.triggering_actor == vars.JOBS_KICK_ACTOR || (github.event_name == 'workflow_dispatch' && endsWith(github.triggering_actor, '[bot]'))
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "::error::This workflow refuses runs started by the worker-kick app or, by hand, by any bot ($TRIGGERING_ACTOR, $EVENT_NAME). Only Jobs may be started that way."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: '/language:${{ matrix.language }}'
