# Background jobs for the hosted environment (ADR 0005 §3, T-M2-06a; production naming T-M2-36). There is no
# container host for the worker yet (a PO cost decision before the first customer, ADR 0005 §1), so GitHub
# runs one worker pass every 5 minutes (scheduled runs can start late) and on demand
# (Actions → Jobs → Run workflow): install or upgrade the queue schema, dispatch pending events, run every
# job that is due, exit. Scheduled runs always target production; a run by hand may still choose the old
# `staging` project until it is deleted (production-setup.md step 39). Runbook: docs/engineering/background-jobs.md.
# Configuration lives in its own GitHub *environment* per target (Settings → Environments → production-jobs;
# the old project: staging-jobs), whose "Deployment branches" rule (main only) is the access control; it
# holds no migration credential:
#   secret   DATABASE_URL_APP_QUEUE   login role app_queue via the Supabase session pooler
#   secret   DATABASE_URL_APP_WORKER  login role app_worker via the Supabase session pooler
#   variable DATABASE_CA_CERT         PEM of the server's root CA (same value as in `production`)
#   E-mail (T-M2-06b; ADR 0008), optional — without EMAIL_PROVIDER this workflow passes `none`
#   (e-mail switched off: queued messages are recorded as suppressed):
#   variable EMAIL_PROVIDER           resend
#   variable EMAIL_FROM_NAME          display name of the sender (e.g. ENTLAQA LMS)
#   variable EMAIL_FROM_ADDRESS       sender address on the verified sending domain
#   secret   RESEND_API_KEY           Resend API key (sending access only)
#   secret   EMAIL_TEST_TO            recipient of the test e-mail (mode test-email)
#   variable APP_BASE_URL             public origin of the web app (https://…, no path) for
#                                     links in e-mails (invitations, T-M2-07; password reset, T-M2-17);
#                                     required once EMAIL_PROVIDER is set — without it (e-mail off)
#                                     invitations are not mailed
#   Password-reset links (T-M2-17), optional — needed once the web app runs with
#   PASSWORD_RESET_DELIVERY=worker; the Auth admin key exists HERE ONLY, never in Vercel (ADR 0002 §7):
#   variable SUPABASE_URL             the project's API origin (https://<ref>.supabase.co)
#   secret   SUPABASE_SECRET_KEY      a Supabase secret key (sb_secret_…) of that project
#   (the same two settings give the worker Storage for the file tasks of T-M2-18: retention housekeeping,
#   and the malware scan when the scanner below is on)
#   File scanning (T-M2-18, ADR 0006 §8), optional — uploads stay unscanned (never clean, so never usable)
#   until it is on:
#   variable FILE_SCANNING            on = start clamd on the runner for each pass, with signatures
#                                     refreshed by freshclam at most once a day (kept in the Actions cache);
#                                     adds about 1–2 minutes of signature loading to every run. Signatures
#                                     older than 7 days: the worker scans nothing (fail closed, an error in
#                                     the run log). A continuous worker host is the PO's pending cost
#                                     decision (docs/engineering/files.md §7). If clamd does not start, the
#                                     pass still runs (e-mails, housekeeping) without scanning, and the run
#                                     is marked failed afterwards.
#   variable FILE_ORPHAN_SWEEP        off = pause the removal of orphan objects (set it BEFORE restoring
#                                     the database or Storage; docs/engineering/files.md §4); unset = on
#   Bulk user imports (T-M2-12; they run with Storage, above), optional — unset = the defaults
#   (docs/engineering/user-import.md §4; the PO may change the numbers):
#   variable USER_IMPORT_INVITATION_INTERVAL_MS   pace of import invitations for the whole installation
#                                     (default 1000; at least 500, the provider's 2 requests a second)
#   variable USER_IMPORT_DAILY_INVITATIONS        per organization and UTC day (default 5000)
#   variable USER_IMPORT_TRIAL_DAILY_INVITATIONS  the same on trial (default 200)
# Until both connection secrets exist each run ends with a notice and does nothing (no failure, no e-mail).
name: Jobs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'pass = run due jobs · test-email = send one sample e-mail to EMAIL_TEST_TO'
        type: choice
        options: [pass, test-email]
        default: pass
      environment:
        description: 'Target (staging = the old project, only until it is deleted)'
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

# Scheduled runs have no inputs: `inputs.environment || 'production'` is the target everywhere below.
concurrency:
  group: jobs-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  pass:
    name: Worker pass (${{ inputs.environment || 'production' }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ format('{0}-jobs', inputs.environment || 'production') }}
    steps:
      - name: Configured?
        id: configured
        env:
          QUEUE_URL: ${{ secrets.DATABASE_URL_APP_QUEUE }}
          WORKER_URL: ${{ secrets.DATABASE_URL_APP_WORKER }}
          TARGET: ${{ format('{0}-jobs', inputs.environment || 'production') }}
        run: |
          if [[ -z "$QUEUE_URL" || -z "$WORKER_URL" ]]; then
            echo "::notice::$TARGET is not configured yet (docs/engineering/production-setup.md §H); nothing to do"
            echo "ready=false" >>"$GITHUB_OUTPUT"
          else
            echo "ready=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.configured.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: PostgreSQL client (for the deploy lock)
        if: steps.configured.outputs.ready == 'true'
        run: |
          if ! command -v psql >/dev/null; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          psql --version
      - name: Install the worker's dependencies only (frozen lockfile) and bundle it
        if: steps.configured.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile --filter '@jadarat/worker...'
          pnpm --filter @jadarat/worker build
      # Signatures for this pass's scanner (opt-in): yesterday's (or older) from the Actions cache, refreshed
      # by freshclam once a day — not every 5 minutes, which would get the runner rate-limited by the public
      # mirror. freshclam verifies the databases' signatures itself. A failed refresh keeps the cached
      # signatures (the worker refuses to scan once they are older than 7 days, and says so).
      - name: Malware signatures (cache)
        id: signatures
        if: steps.configured.outputs.ready == 'true' && vars.FILE_SCANNING == 'on' && inputs.mode != 'test-email'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/clamav-db
          key: clamav-db-${{ github.run_id }}
          restore-keys: clamav-db-
      - name: Malware signatures (refresh, once a day)
        id: freshclam
        if: steps.configured.outputs.ready == 'true' && vars.FILE_SCANNING == 'on' && inputs.mode != 'test-email'
        continue-on-error: true
        env:
          DB: ${{ runner.temp }}/clamav-db
          CACHED_KEY: ${{ steps.signatures.outputs.cache-matched-key }}
        run: |
          image='clamav/clamav:1.5.4-debian@sha256:9bb8712a50f0e75166e936c452cd82dd5e5be0b85586598930b5bbb84a99a578'
          mkdir -p "$DB" && chmod 0777 "$DB"
          if [[ -z "$(ls -A "$DB")" ]]; then
            # First run: start from the image's signatures (freshclam then downloads only the differences).
            docker run --rm --user 1000:1000 -v "$DB:/seed" --entrypoint sh "$image" -c 'cp -a /var/lib/clamav/. /seed/'
          fi
          today="clamav-db-$(date -u +%F)"
          if [[ "$CACHED_KEY" == "$today"* ]]; then
            echo "signatures already refreshed today"; echo "save=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          docker run --rm --read-only --tmpfs /tmp --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
            -v "$DB:/var/lib/clamav" -v "$PWD/infra/docker/clamav/freshclam.conf:/etc/jadarat/freshclam.conf:ro" \
            --entrypoint freshclam "$image" --stdout --config-file=/etc/jadarat/freshclam.conf
          echo "save=true" >>"$GITHUB_OUTPUT"
          echo "key=$today-$GITHUB_RUN_ID" >>"$GITHUB_OUTPUT"
      - name: Malware signatures (keep today's)
        if: steps.freshclam.outputs.save == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/clamav-db
          key: ${{ steps.freshclam.outputs.key }}
      # The malware scanner for this pass: the same clamd image and limits as the self-hosted stack,
      # unprivileged, read-only, its scratch space bounded, reachable on the runner's loopback only. If it
      # does not start, only the scanning of this pass is skipped (e-mails and housekeeping still run):
      # uploads wait for the next pass, never clean; the run is marked failed at its end.
      - name: Malware scanner (clamd) for this pass
        id: clamd
        if: steps.configured.outputs.ready == 'true' && vars.FILE_SCANNING == 'on' && inputs.mode != 'test-email'
        env:
          DB: ${{ runner.temp }}/clamav-db
        run: |
          mounts=()
          if [[ -n "$(ls -A "$DB" 2>/dev/null)" ]]; then mounts=(-v "$DB:/var/lib/clamav:ro"); fi
          docker run -d --name clamd --read-only --tmpfs /tmp:size=2048m --user 1000:1000 --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:3310:3310 "${mounts[@]}" \
            -v "$PWD/infra/docker/clamav/clamd.conf:/etc/jadarat/clamd.conf:ro" --entrypoint clamd \
            clamav/clamav:1.5.4-debian@sha256:9bb8712a50f0e75166e936c452cd82dd5e5be0b85586598930b5bbb84a99a578 \
            --foreground --config-file=/etc/jadarat/clamd.conf || true
          for _ in $(seq 1 60); do
            if docker exec clamd clamdcheck.sh >/dev/null 2>&1; then
              echo "ready=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$(docker inspect -f '{{.State.Running}}' clamd 2>/dev/null)" == "true" ]] || break
            sleep 5
          done
          echo "::error::clamd did not become ready; this pass runs without scanning (uploads wait for the next pass)"
          docker logs --tail 30 clamd || true
          echo "ready=false" >>"$GITHUB_OUTPUT"
      # The pass holds the deploy lock shared (as app_worker; scripts/run-outside-deploy.sh): it is skipped
      # with a notice while a DB deploy or provisioning run holds or waits for the lock, and a deploy that
      # starts during the pass waits for it.
      - name: One worker pass (or a test e-mail)
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL_APP_QUEUE: ${{ secrets.DATABASE_URL_APP_QUEUE }}
          DATABASE_URL_APP_WORKER: ${{ secrets.DATABASE_URL_APP_WORKER }}
          DATABASE_CA_CERT: ${{ vars.DATABASE_CA_CERT }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'none' }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TEST_TO: ${{ secrets.EMAIL_TEST_TO }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLAMD_HOST: ${{ steps.clamd.outputs.ready == 'true' && '127.0.0.1' || '' }}
          FILE_ORPHAN_SWEEP: ${{ vars.FILE_ORPHAN_SWEEP }}
          USER_IMPORT_INVITATION_INTERVAL_MS: ${{ vars.USER_IMPORT_INVITATION_INTERVAL_MS }}
          USER_IMPORT_DAILY_INVITATIONS: ${{ vars.USER_IMPORT_DAILY_INVITATIONS }}
          USER_IMPORT_TRIAL_DAILY_INVITATIONS: ${{ vars.USER_IMPORT_TRIAL_DAILY_INVITATIONS }}
          MODE: ${{ inputs.mode == 'test-email' && 'test-email' || 'once' }}
          JADARAT_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          JADARAT_RELEASE: ${{ github.sha }}
        run: DATABASE_URL="$DATABASE_URL_APP_WORKER" bash scripts/run-outside-deploy.sh node apps/worker/dist/main.mjs "$MODE"
      - name: Scanner was not available
        if: steps.clamd.outcome == 'success' && steps.clamd.outputs.ready != 'true'
        run: |
          echo "::error::this pass ran without malware scanning (clamd did not start); see the step above"
          exit 1
