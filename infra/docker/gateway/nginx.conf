# TLS gateway in front of the Auth server, mirroring Supabase's URL layout (/auth/v1/…) so the app's
# Supabase client works unchanged. The app reaches it as https://gateway:8443 (private CA). Port 8443 serves
# NO admin path (/auth/v1/admin/…, /auth/v1/invite): Auth's admin API is on port 8444 only, not published,
# for two internal networks — auth-admin (the workers: password-reset links) and auth-tools (the
# operators' admin-cli: creating users) — T-M2-17 security review. Port 8100 serves the GlitchTip UI over
# TLS (GlitchTip itself has no route out of the installation). Supabase Storage (T-M2-18): on 8443 only the
# USE of signed URLs (PUT uploads, GET downloads); their creation (POST) on 8445, the app's network only
# (security review M2: a user's own token must not mint a long-lived link); the worker's Storage calls on
# 8444 (workers' network only).
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Password reset (T-M2-08): Auth's /verify also accepts the 6-digit e-mail code, and self-hosted Auth has
  # no per-client limit without a trusted client-IP header (docs/engineering/password-reset.md). Limit it
  # per source address here. The app's own calls share the app's address: 30 a minute is far above its
  # reset volume.
  limit_req_zone $binary_remote_addr zone=auth_verify:1m rate=30r/m;
  limit_req_status 429;
  # Auth's own per-IP limits (T-M2-11; compose.yaml GOTRUE_RATE_LIMIT_HEADER = X-Jadarat-Rate-Limit-Key):
  # the key is ALWAYS set here, never taken from the caller. From the app's network (edge,
  # 10.231.0.32/28 — compose.yaml; .33 is the bridge, i.e. the host through a published port) it is the
  # visitor key the app sends in X-Jadarat-Client (its trusted client address, IPv6 by its /64) — or none
  # when the app has no trusted address: Auth then limits nothing for that call (the app's shared limiter
  # does). From anywhere else it is the caller's own address: a direct caller cannot choose its key.
  geo $jadarat_from_app {
    default 0;
    10.231.0.32/28 1;
    10.231.0.33 0;
  }
  map "$jadarat_from_app|$http_x_jadarat_client" $jadarat_rate_limit_key {
    "~^1\|(?<visitor>[0-9A-Fa-f:.]{2,45}(/64)?)$" $visitor;
    "~^1\|" "";
    default $remote_addr;
  }
  server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Prefix match (`^~`), not `=`: Auth's router also serves /verify/ (security review M). proxy_pass
    # with a URI replaces the matched prefix: /auth/v1/verify/… → /verify/…, the query string is kept.
    location ^~ /auth/v1/verify {
      limit_req zone=auth_verify burst=10 nodelay;
      proxy_pass http://auth:9999/verify;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Jadarat-Rate-Limit-Key $jadarat_rate_limit_key;
      proxy_set_header X-Jadarat-Client "";
    }
    # Auth's public endpoints that e-mail recovery or sign-in tokens (T-M2-17): unused — the worker creates
    # reset links through the admin API and sends them itself; Auth has no mail relay. Refused here, so
    # nobody can make Auth issue a new recovery token (which would invalidate the link a user was just
    # sent) or tell accounts apart through them.
    location ^~ /auth/v1/recover { return 404; }
    location ^~ /auth/v1/otp { return 404; }
    location ^~ /auth/v1/magiclink { return 404; }
    location ^~ /auth/v1/resend { return 404; }
    # Auth's admin API (and /invite, which needs an admin key) is never served here — not to the app, not
    # through the published port: only on 8444 below (security review T-M2-17).
    location ^~ /auth/v1/admin { return 404; }
    location ^~ /auth/v1/invite { return 404; }
    location /auth/v1/ {
      proxy_pass http://auth:9999/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Jadarat-Rate-Limit-Key $jadarat_rate_limit_key;
      proxy_set_header X-Jadarat-Client "";
    }
    # Supabase Storage (T-M2-18, ADR 0006): ONLY the use of signed URLs, nothing else of Storage's API (no
    # URL creation — that is port 8445's, for the app alone —, no listing, no direct upload or download with
    # a token, no buckets, no S3 protocol):
    #   PUT     /storage/v1/object/upload/sign/<bucket>/<key>?token=…  the browser uploads with the URL
    #   OPTIONS /storage/v1/object/upload/sign/<bucket>/<key>?token=…  its CORS preflight (answered here)
    #   GET     /storage/v1/object/sign/<bucket>/<key>?token=…         the browser downloads with the URL
    # Responses never render as active content on this origin: nosniff and a sandboxing CSP. Errors are
    # logged at `crit` only: nginx's `error` lines (e.g. a refused method) quote the request line, i.e. the
    # URL's token and the download name (Storage logs its own errors without them).
    location ^~ /storage/v1/object/upload/sign/ {
      error_log /var/log/nginx/error.log crit;
      limit_except PUT OPTIONS { deny all; }
      # CORS: the browser PUTs from the app's origin. Storage has no CORS handling of its own (hosted
      # Supabase's API gateway adds it), so the preflight is answered here and the PUT's answer carries the
      # origin header. Any origin: the URL's token is the upload's only authorization; no cookie or
      # credential is ever sent or allowed.
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "PUT" always;
        add_header Access-Control-Allow-Headers "content-type, cache-control, x-upsert, x-client-info, apikey" always;
        add_header Access-Control-Max-Age 600 always;
        add_header X-Content-Type-Options nosniff always;
        return 204;
      }
      add_header Access-Control-Allow-Origin "*" always;
      client_max_body_size 210m;
      proxy_request_buffering off;
      proxy_pass http://storage:5000/object/upload/sign/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      # No visitor or client-address header reaches Storage, also not one the browser sent (integration
      # review): Storage uses none of them here (it logs no request lines; the URL's token is the only
      # authorization), and the visitor's address stays out of it.
      proxy_set_header X-Jadarat-Client "";
      proxy_set_header X-Jadarat-Rate-Limit-Key "";
      proxy_set_header X-Real-IP "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
      proxy_set_header X-HTTP-Method-Override "";
      proxy_set_header X-HTTP-Method "";
      proxy_set_header X-Method-Override "";
      proxy_set_header X-Upsert "";
      add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /storage/v1/object/sign/ {
      error_log /var/log/nginx/error.log crit;
      limit_except GET { deny all; }
      # Exactly the link the app hands out: the URL's token, then the saved name, which ends in the
      # extension of the type found by content (platform-files downloadName; this list = its
      # DOWNLOAD_EXTENSIONS, a config test keeps them equal). Storage does not sign the `download`
      # parameter: without this, a link's holder could have a clean CSV saved as `.hta` or `.js`, or drop
      # the attachment. Case-sensitive (Storage ignores `DOWNLOAD=` and would serve no attachment); only
      # the extension's case is free.
      if ($args !~ "^token=[A-Za-z0-9._-]+&download=[^&]+\.(?i:csv|xlsx|png|jpe?g|webp|pdf)$") { return 403; }
      client_max_body_size 16k;
      proxy_pass http://storage:5000/object/sign/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Jadarat-Client "";
      proxy_set_header X-Jadarat-Rate-Limit-Key "";
      proxy_set_header X-Real-IP "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
      proxy_set_header X-HTTP-Method-Override "";
      proxy_set_header X-HTTP-Method "";
      proxy_set_header X-Method-Override "";
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    location ^~ /storage/ { return 404; }
    location / { return 404; }
  }
  # Creating signed URLs (T-M2-18, security review M2): the app asks Storage — with the signed-in user's own
  # session, so our storage policies decide — on this port only, which is not published and answers the
  # `edge` network alone (10.231.0.32/28: the app and the gateway — the only network they share; compose.yaml
  # fixes the subnet, change both files together), minus its bridge address .33 (the host, also for the
  # published ports). Every other network is refused. Browsers never reach it: a user's own token cannot ask
  # for a link of any lifetime.
  #   POST /storage/v1/object/upload/sign/<bucket>/<key>   a signed upload URL (the user's pending key)
  #   POST /storage/v1/object/sign/<bucket>/<key>          a signed download URL (a clean file with a grant)
  #   GET  /storage/v1/object/images/<key>                 the admin's own branding upload, read back at save
  #                                                        time (WP-ADM-02, 20 Oct 2026: not virus-scanned)
  server {
    listen 8445 ssl;
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    error_log /var/log/nginx/error.log crit;
    deny 10.231.0.33;
    allow 10.231.0.32/28;
    deny all;
    location ^~ /storage/v1/object/upload/sign/ {
      limit_except POST { deny all; }
      proxy_pass http://storage:5000/object/upload/sign/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      # The method is the request's own (POST, checked above); never an upsert URL.
      proxy_set_header X-HTTP-Method-Override "";
      proxy_set_header X-HTTP-Method "";
      proxy_set_header X-Method-Override "";
      proxy_set_header X-Upsert "";
      # No visitor or client-address header reaches Storage (integration review L2): the app's visitor key
      # is for Auth's per-IP limits only (T-M2-11).
      proxy_set_header X-Jadarat-Client "";
      proxy_set_header X-Jadarat-Rate-Limit-Key "";
      proxy_set_header X-Real-IP "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
    }
    location ^~ /storage/v1/object/sign/ {
      limit_except POST { deny all; }
      proxy_pass http://storage:5000/object/sign/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-HTTP-Method-Override "";
      proxy_set_header X-HTTP-Method "";
      proxy_set_header X-Method-Override "";
      proxy_set_header X-Jadarat-Client "";
      proxy_set_header X-Jadarat-Rate-Limit-Key "";
      proxy_set_header X-Real-IP "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
    }
    # Branding images (WP-ADM-02; PO, 20 Oct 2026: not virus-scanned): at save time the app reads back the
    # admin's own upload with the admin's own session — GET, the `images` bucket only. Storage's read policy
    # admits nothing else (private.can_read_object: the uploader's own upload of a purpose without a scan,
    # waiting to be accepted, for a day). Answers stream back to the app; nothing reaches a browser here.
    location ^~ /storage/v1/object/images/ {
      limit_except GET { deny all; }
      proxy_pass http://storage:5000/object/images/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-HTTP-Method-Override "";
      proxy_set_header X-HTTP-Method "";
      proxy_set_header X-Method-Override "";
      proxy_set_header X-Jadarat-Client "";
      proxy_set_header X-Jadarat-Rate-Limit-Key "";
      proxy_set_header X-Real-IP "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
    }
    location / { return 404; }
  }
  # Auth's admin API, by source network (compose.yaml fixes both subnets; change them together). Not
  # published to the host; every other source address — the app on `edge`, GlitchTip on `errors-ui`, the host
  # through a bridge (each bridge's own .1/.17 address) — is refused. Exactly two calls, each for one
  # network: recovery links for the workers (auth-admin, 10.231.0.0/28: POST /admin/generate_link — no
  # listing, changing or deleting users; generate_link can also ask for signup/magic-link links, but
  # every user creation still passes Auth's sign-up hook, which admits only a valid invitation) and
  # creating a confirmed user for the operators' admin-cli (auth-tools, 10.231.0.16/28: POST /admin/users).
  # Callers still need a service_role token.
  server {
    listen 8444 ssl;
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    deny 10.231.0.1;
    deny 10.231.0.17;
    allow 10.231.0.0/27;
    deny all;
    location = /auth/v1/admin/generate_link {
      deny 10.231.0.1;
      allow 10.231.0.0/28;
      deny all;
      limit_except POST { deny all; }
      proxy_pass http://auth:9999/admin/generate_link;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Jadarat-Rate-Limit-Key $remote_addr;
      proxy_set_header X-Jadarat-Client "";
      # The method is the request's own (POST, checked above): no override header reaches Auth.
      proxy_set_header X-HTTP-Method-Override "";
      proxy_set_header X-HTTP-Method "";
      proxy_set_header X-Method-Override "";
    }
    location = /auth/v1/admin/users {
      deny 10.231.0.17;
      allow 10.231.0.16/28;
      deny all;
      limit_except POST { deny all; }
      proxy_pass http://auth:9999/admin/users;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Jadarat-Rate-Limit-Key $remote_addr;
      proxy_set_header X-Jadarat-Client "";
      # The method is the request's own (POST, checked above): no override header reaches Auth.
      proxy_set_header X-HTTP-Method-Override "";
      proxy_set_header X-HTTP-Method "";
      proxy_set_header X-Method-Override "";
    }
    # Storage with the worker's key (T-M2-18, ADR 0006 §3.4, §7), for the workers' network only: reading
    # uploads to scan them (GET /object/authenticated/…), quarantine moves (POST /object/move), removals
    # (DELETE /object/<bucket>/<key>) and generated files (POST /object/<bucket>/<key>). Streamed both ways.
    location ^~ /storage/v1/object/ {
      deny 10.231.0.1;
      allow 10.231.0.0/28;
      deny all;
      limit_except GET POST DELETE { deny all; }
      client_max_body_size 60m;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 600s;
      proxy_pass http://storage:5000/object/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-HTTP-Method-Override "";
      proxy_set_header X-HTTP-Method "";
      proxy_set_header X-Method-Override "";
    }
    location / { return 404; }
  }
  server {
    listen 8100 ssl;
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    # Resolved per request (Docker DNS), so the gateway also starts when GlitchTip is not running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $glitchtip http://glitchtip:8000;
    location / {
      proxy_pass $glitchtip;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
  # Container health check only (loopback inside the container; not published).
  server {
    listen 127.0.0.1:8081;
    location = /healthz { return 200 'ok'; }
  }
}
