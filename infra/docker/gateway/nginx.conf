# TLS gateway in front of the Auth server, mirroring Supabase's URL layout (/auth/v1/…) so the app's
# Supabase client works unchanged. The app reaches it as https://gateway:8443 (private CA), and so does
# the worker for the Auth admin API (password-reset links, T-M2-17; internal network auth-admin). Port 8100
# serves the GlitchTip UI over TLS (GlitchTip itself has no route out of the installation).
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Password reset (T-M2-08): Auth's /verify also accepts the 6-digit e-mail code, and self-hosted Auth has
  # no per-client limit without a trusted client-IP header (docs/engineering/password-reset.md). Limit it
  # per source address here. The app's own calls share the app's address: 30 a minute is far above its
  # reset volume.
  limit_req_zone $binary_remote_addr zone=auth_verify:1m rate=30r/m;
  limit_req_status 429;
  server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Prefix match (`^~`), not `=`: Auth's router also serves /verify/ (security review M). proxy_pass
    # with a URI replaces the matched prefix: /auth/v1/verify/… → /verify/…, the query string is kept.
    location ^~ /auth/v1/verify {
      limit_req zone=auth_verify burst=10 nodelay;
      proxy_pass http://auth:9999/verify;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    # Auth's public endpoints that e-mail recovery or sign-in tokens (T-M2-17): unused — the worker creates
    # reset links through the admin API and sends them itself; Auth has no mail relay. Refused here, so
    # nobody can make Auth issue a new recovery token (which would invalidate the link a user was just
    # sent) or tell accounts apart through them.
    location ^~ /auth/v1/recover { return 404; }
    location ^~ /auth/v1/otp { return 404; }
    location ^~ /auth/v1/magiclink { return 404; }
    location ^~ /auth/v1/resend { return 404; }
    location /auth/v1/ {
      proxy_pass http://auth:9999/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
  }
  server {
    listen 8100 ssl;
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    # Resolved per request (Docker DNS), so the gateway also starts when GlitchTip is not running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $glitchtip http://glitchtip:8000;
    location / {
      proxy_pass $glitchtip;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
  # Container health check only (loopback inside the container; not published).
  server {
    listen 127.0.0.1:8081;
    location = /healthz { return 200 'ok'; }
  }
}
