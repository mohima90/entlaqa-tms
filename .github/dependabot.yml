# Nightly/weekly dependency updates (Development Plan §5.3, §8.3 supply chain). Every update is a PR
# that must pass all CI gates; the PO merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Riyadh
    open-pull-requests-limit: 10
    ignore:
      # Node.js 24 LTS is the runtime (.nvmrc, ADR 0001): its type definitions must stay on the same
      # major. Major Node upgrades are a deliberate change (runtime + CI + Vercel), not a Dependabot PR.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # One combined pull request per week for every minor/patch update (PO request, 4 Oct 2026: fewer,
    # bigger updates). Major versions still come one by one — they need a deliberate look.
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels: ['dependencies']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Riyadh
    groups:
      actions:
        patterns: ['*']
    labels: ['dependencies', 'ci']
  # Self-hosted stack images (T-M1-D04): Dockerfile base image and the digest-pinned compose images.
  # Each bump re-runs gate 15 (whole stack + sign-in + image scan) before the PO merges.
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Riyadh
    groups:
      images:
        patterns: ['*']
    labels: ['dependencies']
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Riyadh
    groups:
      images:
        patterns: ['*']
    labels: ['dependencies']
