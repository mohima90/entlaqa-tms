# Jadarat TMS — self-hosted (sovereign) stack, T-M1-D04 walking skeleton (ADR 0010). Runbook: README.md.
# Everything runs in-country on the customer's servers: PostgreSQL 17 (Supabase image, same major/minor as
# the cloud), Supabase Auth (GoTrue) with the Custom Access Token and sign-up (before user created) hooks,
# a TLS gateway, the app, the
# background-job worker, and the in-country error tracker (GlitchTip, Sentry-compatible; ADR 0009 §4)
# with its own database.
# TLS verified against the installation's CA on every hop that leaves a private network: app/worker → db,
# worker and Auth → mail relay (STARTTLS), Auth → db (PostgreSQL requires TLS for all network clients,
# db/pg_hba.conf) and app → gateway; the GlitchTip UI is served through the gateway's TLS too.
# Plain-HTTP hops run only on internal networks:
# gateway → Auth, Auth → its e-mail templates and app/gateway → GlitchTip (none has a TLS listener). Auth and GlitchTip
# have no outbound route. Containers drop privileges; app, worker, gateway, Auth and GlitchTip are
# read-only.
# Images are pinned by digest (multi-arch index); bump deliberately with the hosted versions.
# Secrets: ./gen-secrets.sh → .secrets/ (git-ignored); always run compose with
#   docker compose --env-file .secrets/.env …
# so ${…} below are filled from it. Ports are bound to 127.0.0.1 only.
name: jadarat

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']

# Auth sits only on internal networks (no outbound route); the app cannot reach Auth except through the
# gateway, and the gateway cannot reach the database.
networks:
  db-auth: { internal: true } # db ⇄ Auth
  auth-internal: { internal: true } # gateway ⇄ Auth (the plain-HTTP hop); Auth ⇄ its e-mail templates
  db-app: {} # db ⇄ app (+ the db host port used for migrations)
  edge: {} # app ⇄ gateway (+ published ports)
  errors: { internal: true } # app, gateway ⇄ GlitchTip (plain HTTP; no route out of the installation)
  errors-internal: { internal: true } # GlitchTip ⇄ its own database (error data never in the TMS db)
  mail: { internal: true } # worker, Auth ⇄ Mailpit (SMTP with STARTTLS)

services:
  db:
    image: supabase/postgres:17.11.0.003@sha256:7374d196da7e301512cc5329e18040e0f7bb856287b323777cdadecccbc6c7e4
    <<: *hardening
    networks: [db-auth, db-app]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run with --env-file .secrets/.env}
      # Verifier only (db/99-roles.sql): the clear Auth password never reaches the database.
      AUTH_DB_PASSWORD_SCRAM: ${AUTH_DB_PASSWORD_SCRAM:?run with --env-file .secrets/.env}
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: postgres
      POSTGRES_PORT: '5432'
    # TLS: the key must be owned by postgres with mode 0600, so copy it in before the server starts.
    entrypoint:
      - bash
      - -c
      - |
        install -d -o postgres -m 700 /var/lib/postgresql/certs
        install -o postgres -m 600 /certs-src/db.key /var/lib/postgresql/certs/server.key
        install -o postgres -m 644 /certs-src/db.crt /var/lib/postgresql/certs/server.crt
        exec docker-entrypoint.sh postgres -D /etc/postgresql -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/certs/server.crt \
          -c ssl_key_file=/var/lib/postgresql/certs/server.key \
          -c hba_file=/etc/jadarat/pg_hba.conf
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./.secrets/db.crt:/certs-src/db.crt:ro
      - ./.secrets/db.key:/certs-src/db.key:ro
      - ./db/pg_hba.conf:/etc/jadarat/pg_hba.conf:ro
      - ./db/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    ports:
      - 127.0.0.1:55432:5432
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 30

  auth:
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    <<: *hardening
    read_only: true
    cap_drop: [ALL]
    # `mail`: Auth sends its own e-mails (password reset, password changed; T-M2-08) to the relay.
    networks: [db-auth, auth-internal, mail]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9999/health']
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      db: { condition: service_healthy }
      # Auth reads its e-mail templates at start-up and falls back to its English default when it
      # cannot (logged as `template_body_http_error` — alert on it): start only once they are served.
      auth-templates: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    volumes:
      - ./.secrets/ca.crt:/certs/ca.crt:ro
      # The relay's CA, added to (not replacing) the system roots — see SSL_CERT_DIR below.
      - ${AUTH_SMTP_CA_CERT_FILE:-./.secrets/mail-ca.crt}:/certs/mail/smtp-ca.crt:ro
    environment:
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:?run with --env-file .secrets/.env}@db:5432/postgres?sslmode=verify-full&sslrootcert=/certs/ca.crt
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?run with --env-file .secrets/.env}
      # ES256 signing key (JWK); its public half is served at /auth/v1/.well-known/jwks.json.
      GOTRUE_JWT_KEYS: '${JWT_KEYS:?run with --env-file .secrets/.env}'
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: https://localhost:8443/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_SITE_URL: http://localhost:3200
      GOTRUE_URI_ALLOW_LIST: http://localhost:3200
      # Sign-ups are OPEN so that an invitee creates their own account through the public API; the
      # before-user-created hook below refuses every sign-up without a valid invitation token for that
      # e-mail (FR-IAM-03, ADR 0002 §7 note T-M2-07). Never open sign-ups without the hook.
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: '900'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      # No confirmation e-mails: administrators create confirmed users, and an invitee's sign-up is
      # confirmed at once — the invitation e-mail proved the address — so it returns a session.
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      # Password reset (FR-IAM-13, T-M2-08; docs/engineering/password-reset.md): Auth e-mails the link
      # itself, through the installation's relay (here Mailpit). The template links straight to our page
      # with the token hash in the URL fragment; the link is valid for 60 minutes, single use, and one
      # e-mail a minute per account.
      # TLS: Auth's mailer uses implicit TLS on port 465 and otherwise STARTTLS ONLY IF the relay offers
      # it — so a real installation uses port 465, or a relay that requires TLS and authentication
      # (Mailpit here requires STARTTLS). Certificates are verified against the system roots PLUS the
      # relay's CA mounted in /certs/mail (AUTH_SMTP_CA_CERT_FILE, default the stack's mail CA): Go reads
      # its default CA file and every directory in SSL_CERT_DIR (SSL_CERT_FILE would replace the roots).
      GOTRUE_SMTP_HOST: ${AUTH_SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${AUTH_SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${AUTH_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${AUTH_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${EMAIL_FROM_ADDRESS:-noreply@jadarat.example}
      GOTRUE_SMTP_SENDER_NAME: ${EMAIL_FROM_NAME:-Jadarat}
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      SSL_CERT_DIR: /etc/ssl/certs:/certs/mail
      GOTRUE_MAILER_OTP_EXP: '3600'
      # The link's token hash is sha224(e-mail + one-time code): a 6-digit code would leave about 20 bits
      # to guess once the address is known. 10 digits is GoTrue's maximum (security review, T-M2-08).
      GOTRUE_MAILER_OTP_LENGTH: '10'
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://auth-templates:8080/recovery.html
      GOTRUE_MAILER_SUBJECTS_RECOVERY: 'إعادة تعيين كلمة المرور · Reset your password'
      # Auth's own /verify path, used only by its English fallback template (see auth-templates).
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      # After every password change (reset or My profile) the account owner gets a notice.
      GOTRUE_MAILER_NOTIFICATIONS_PASSWORD_CHANGED_ENABLED: 'true'
      GOTRUE_MAILER_TEMPLATES_PASSWORD_CHANGED_NOTIFICATION: http://auth-templates:8080/password-changed.html
      GOTRUE_MAILER_SUBJECTS_PASSWORD_CHANGED_NOTIFICATION: 'تغيّرت كلمة المرور · Your password was changed'
      # My profile (FR-IAM-16): Auth itself requires the current password to set a new one, and a
      # minimum length matching the application's rule (12).
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_CURRENT_PASSWORD: 'true'
      GOTRUE_PASSWORD_MIN_LENGTH: '12'
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: 'true'
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/private/custom_access_token_hook
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: 'true'
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: pg-functions://postgres/private/before_user_created_hook

  # Auth's e-mail templates (supabase/templates, T-M2-08), read by Auth over plain HTTP on the internal
  # auth-internal network (GoTrue takes templates by URL only). Nothing else is served.
  auth-templates:
    image: nginxinc/nginx-unprivileged:stable-alpine-slim@sha256:e28dcf0a161ddcbf228c7364b4a14f9bad4763ae8f5317c437b896afa3df4b84
    <<: *hardening
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    networks: [auth-internal]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/recovery.html']
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ./auth-templates/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../supabase/templates:/srv/templates:ro

  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine-slim@sha256:e28dcf0a161ddcbf228c7364b4a14f9bad4763ae8f5317c437b896afa3df4b84
    <<: *hardening
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    networks: [auth-internal, edge, errors]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/healthz']
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      auth: { condition: service_healthy }
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.secrets/gateway.crt:/etc/nginx/certs/gateway.crt:ro
      - ./.secrets/gateway.key:/etc/nginx/certs/gateway.key:ro
    ports:
      - 127.0.0.1:8443:8443
      - 127.0.0.1:8100:8100 # GlitchTip UI (TLS)

  app:
    build:
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    image: jadarat/suite:local
    <<: *hardening
    read_only: true
    cap_drop: [ALL]
    tmpfs: ['/app/apps/suite/.next/cache:uid=65532,gid=65532,mode=0700'] # distroless nonroot
    networks: [db-app, edge, errors]
    depends_on:
      gateway: { condition: service_healthy }
    volumes:
      - ./.secrets/ca.crt:/run/secrets/ca.crt:ro
    environment:
      # Request path: login role app_server only (never the migration role); TLS verify-full via the CA file.
      DATABASE_URL_APP_SERVER: postgres://app_server:${APP_SERVER_DB_PASSWORD:?run with --env-file .secrets/.env}@db:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: https://gateway:8443
      # Self-hosted Auth does not check the key; any non-empty value (no Supabase cloud key exists here).
      # The app has no Auth secret key: invitees sign up through the public API (T-M2-07).
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: self-hosted
      DATABASE_CA_CERT_FILE: /run/secrets/ca.crt
      NODE_EXTRA_CA_CERTS: /run/secrets/ca.crt
      JADARAT_ENVIRONMENT: self-hosted
      # REQUIRED in production behind a load balancer or reverse proxy: the name of the client-IP header
      # it OVERWRITES (e.g. X-Real-IP; never X-Forwarded-For). Application rate limits (password reset,
      # error reports) are per client only with it; empty = every visitor shares one budget. Empty here:
      # this stack publishes the app directly. docs/engineering/password-reset.md §5.
      JADARAT_CLIENT_IP_HEADER: ${JADARAT_CLIENT_IP_HEADER:-}
      # Error tracking (ADR 0009 §4): the DSN of this installation's GlitchTip project, with the internal
      # host, e.g. http://<key>@glitchtip:8000/<project id> (README.md, "Error tracking"). Unset = logs only.
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - 127.0.0.1:3200:3000

  # Background jobs (ADR 0005, T-M2-06a): graphile-worker in daemon mode, two replicas — jobs are claimed
  # with SKIP LOCKED, so replicas never run the same job, and one keeps working while the other restarts.
  # Database only (queue as app_queue, tenant work as app_worker; TLS verify-full): no route to Auth.
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    image: jadarat/worker:local
    <<: *hardening
    read_only: true
    cap_drop: [ALL]
    networks: [db-app, mail]
    deploy: { replicas: 2 }
    # SIGTERM lets running jobs finish; give them time before Docker kills the process (a killed job is
    # retried, but only after graphile-worker's 4-hour lock expiry).
    stop_grace_period: 60s
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    volumes:
      - ./.secrets/ca.crt:/run/secrets/ca.crt:ro
      - ./.secrets/mail-ca.crt:/run/secrets/mail-ca.crt:ro
    environment:
      DATABASE_URL_APP_QUEUE: postgres://app_queue:${APP_QUEUE_DB_PASSWORD:?run with --env-file .secrets/.env}@db:5432/postgres
      DATABASE_URL_APP_WORKER: postgres://app_worker:${APP_WORKER_DB_PASSWORD:?run with --env-file .secrets/.env}@db:5432/postgres
      DATABASE_CA_CERT_FILE: /run/secrets/ca.crt
      JADARAT_ENVIRONMENT: self-hosted
      # E-mail (ADR 0008 §2): SMTP with verified STARTTLS. Here Mailpit catches every message. A real
      # installation sets SMTP_URL (smtp://user:password@relay:587) and SMTP_CA_CERT_FILE for its relay
      # (set it empty for a publicly trusted certificate), removes the mailpit service, its depends_on
      # entry and the mail-ca.crt mount, and gives the worker a network that reaches the relay
      # (`mail` is internal). docs/engineering/email.md §2.
      EMAIL_PROVIDER: smtp
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      SMTP_CA_CERT_FILE: ${SMTP_CA_CERT_FILE-/run/secrets/mail-ca.crt}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@jadarat.example}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Jadarat}
      # Public origin of the web app for links in e-mails (invitation accept links): the `app`
      # service as published on this host. An installation sets its own https origin.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3200}

  # Stand-in for the installation's mail relay (T-M2-06b): Mailpit keeps every message for inspection and
  # sends nothing on (internal network, no relay configured). STARTTLS is required, with a certificate
  # from the stack's mail CA (gen-secrets.sh). It receives the worker's e-mails and Auth's own (password
  # reset, T-M2-08). Remove it when SMTP_URL and AUTH_SMTP_* point at a real relay (and remove Auth's
  # depends_on entry; give Auth a network that reaches the relay).
  mailpit:
    image: axllent/mailpit:v1.29.7@sha256:757f22b56c1da03570afdb3d259effe5091018008a81bbedc8158cee7e16fdbc
    <<: *hardening
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    networks: [mail]
    volumes:
      - ./.secrets/mailpit.crt:/certs/mailpit.crt:ro
      - ./.secrets/mailpit.key:/certs/mailpit.key:ro
    environment:
      MP_SMTP_TLS_CERT: /certs/mailpit.crt
      MP_SMTP_TLS_KEY: /certs/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: 'true'
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_MAX_MESSAGES: '500'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 30

  # In-country error tracking (ADR 0009 §4, T-M1-D06): GlitchTip in all-in-one mode (web + worker, no
  # Valkey) with its own PostgreSQL. Errors arrive already scrubbed by the app; retention 90 days.
  errors-db:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    networks: [errors-internal]
    command: ['postgres', '-c', 'max_locks_per_transaction=512']
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_DB: glitchtip
      POSTGRES_PASSWORD: ${ERRORS_DB_PASSWORD:?run with --env-file .secrets/.env}
    volumes:
      - errors-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'glitchtip', '-d', 'glitchtip']
      interval: 5s
      timeout: 5s
      retries: 30

  glitchtip:
    image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    <<: *hardening
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    command: ['./bin/run-all-in-one.sh']
    networks: [errors, errors-internal]
    depends_on:
      errors-db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://glitchtip:${ERRORS_DB_PASSWORD:?run with --env-file .secrets/.env}@errors-db:5432/glitchtip
      VALKEY_URL: ''
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?run with --env-file .secrets/.env}
      # The UI address operators use: through the gateway's TLS (gateway/nginx.conf, port 8100). For a real
      # host name set GLITCHTIP_DOMAIN and GLITCHTIP_EXTRA_HOSTS in .secrets/.env.
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-https://localhost:8100}
      CSRF_TRUSTED_ORIGINS: ${GLITCHTIP_DOMAIN:-https://localhost:8100}
      # Internal names always stay (health check, ingest); GLITCHTIP_EXTRA_HOSTS adds the real host name.
      ALLOWED_HOSTS: glitchtip,localhost,127.0.0.1${GLITCHTIP_EXTRA_HOSTS:+,${GLITCHTIP_EXTRA_HOSTS}}
      ENABLE_USER_REGISTRATION: 'false'
      ENABLE_ORGANIZATION_CREATION: 'false'
      # No Django admin or API browser; no uptime monitoring (it would call out of the installation).
      ENABLE_ADMIN: 'false'
      ENABLE_OPENAPI: 'false'
      GLITCHTIP_ENABLE_UPTIME: 'false'
      # Second line of defence: GlitchTip's own scrubber (sensitive keys, card numbers, private keys); the
      # app already removes e-mails — GlitchTip's e-mail pattern also mangles package paths in stack
      # frames (`next@16.3.8_@babel+core@…`), so it stays off.
      GLITCHTIP_PII_SCRUB_DEFAULT: '{"enabled": true, "scrub_emails": false}'
      GLITCHTIP_RETENTION_DAYS: '90'
    healthcheck:
      test: ['CMD', 'python3', '/code/healthcheck.py']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  db-data:
  errors-db-data:
