# Signature updates for clamd (ADR 0006 §8, T-M2-18): the `freshclam` service writes into the shared
# database volume; clamd reloads it (SelfCheck). It is the only scanning container with a route out, and
# only to the signature mirror. Runs as the image's unprivileged clamav user (uid 1000).
#
# In-country or air-gapped installations: use a private mirror inside the installation instead of the
# public one — comment DatabaseMirror out and set
#   PrivateMirror https://clamav-mirror.customer.internal
# (a host serving main.cvd, daily.cvd, bytecode.cvd, kept current by the customer's approved egress path).
# The workers report signatures older than 24 hours (log reason scanner_signatures_stale; worker mode
# `scanner-check`).
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
Checks 12
Foreground yes
LogTime yes
