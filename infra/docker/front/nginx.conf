# Front proxy of the web app (T-M2-11 security review): the app's only published port. Every request
# reaches the app with X-Real-IP set to the address that connected HERE — never one the visitor sent — and
# the app reads it as its trusted client address (compose.yaml JADARAT_CLIENT_IP_HEADER=x-real-ip), so the
# sign-in limits count each visitor separately instead of one shared budget. The app's own port is not
# published. In a real installation the TLS load balancer in front plays this role: it must OVERWRITE the
# header the app is told to trust (docs/engineering/sign-in-protection.md §5). Plain HTTP here: the stack
# serves the app on http://localhost:3200 (a real installation terminates TLS before the app).
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # The Supabase session lives in chunked cookies of several kilobytes each: requests carry them all, and
  # a sign-in answers with several Set-Cookie headers — more than nginx's default header buffers (one
  # memory page) hold. Sized like the app's own limit (Node.js accepts 16 KB of headers).
  large_client_header_buffers 4 32k;
  proxy_buffer_size 64k;
  proxy_buffers 8 64k;
  proxy_busy_buffers_size 128k;
  server {
    listen 3200;
    client_max_body_size 2m;
    # Resolved per request (Docker DNS), so the proxy also starts (and answers 502) while the app is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:3000;
    location / {
      proxy_pass $app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # The browser's own Host (Next.js compares it with Origin for server actions).
      proxy_set_header Host $http_host;
      # Overwritten, never passed on: the client cannot choose its address.
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto http;
    }
  }
  # Container health check only (loopback inside the container; not published).
  server {
    listen 127.0.0.1:8081;
    location = /healthz { return 200 'ok'; }
  }
}
