# Applies supabase/migrations to a hosted environment (T-M1-D03; runbook: docs/engineering/db-deploy.md).
# Manual: the fallback for re-runs, recovery and the first deploy of a new project — after every merge to
# `main` that changes the deploy path, "DB deploy (after merge)" (db-deploy-auto.yml, T-M2-38) runs the same
# steps on `production` by itself. This workflow and "Provision organization" share the concurrency group
# db-deploy-<environment>; the automatic workflow has its own group (a manual run must never cancel an
# automatic run that waits). The database work of all of them — and the "Jobs" worker pass — is serialized
# by the deploy lock in the scripts (scripts/lib/db-connect.sh § Deploy lock: waits up to 10 minutes).
# Never re-run an old run: start a new one ("Run workflow" on `main`), so the newest commit is deployed.
# Configuration lives in the GitHub *environment* (Settings → Environments → production), whose
# "Deployment branches" rule (main only) is the actual access control — the `if:` below is a convenience,
# because a run from another branch uses that branch's copy of this file.
#   secret   DATABASE_URL            migration connection (Supabase: postgres via the session pooler), no query params
#   secret   APP_SERVER_DB_PASSWORD  password for login role app_server (optional after the first run)
#   secret   APP_WORKER_DB_PASSWORD  password for login role app_worker (optional after the first run)
#   secret   APP_QUEUE_DB_PASSWORD   password for login role app_queue, the job runner (optional after the first run)
#   variable DATABASE_CA_CERT        PEM of the server's root CA (Supabase: Database Settings → SSL Configuration)
# `staging` (the old project) stays selectable only until it is deleted (production-setup.md step 39, T-M2-36).
# Run `plan` first (dry run, always rolled back), then `apply`.
name: DB deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [production, staging]
        default: production
      mode:
        description: 'plan = dry run (rolled back) · apply = apply pending migrations'
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: db-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: DB deploy (${{ inputs.mode }} → ${{ inputs.environment }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Up to 10 minutes waiting for the deploy lock, plus the run.
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: DB deploy (${{ inputs.mode }})
        uses: ./.github/actions/db-deploy
        with:
          mode: ${{ inputs.mode }}
          environment: ${{ inputs.environment }}
          database-url: ${{ secrets.DATABASE_URL }}
          database-ca-cert: ${{ vars.DATABASE_CA_CERT }}
          app-server-db-password: ${{ secrets.APP_SERVER_DB_PASSWORD }}
          app-worker-db-password: ${{ secrets.APP_WORKER_DB_PASSWORD }}
          app-queue-db-password: ${{ secrets.APP_QUEUE_DB_PASSWORD }}
