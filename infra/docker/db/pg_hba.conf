# Self-hosted stack (T-M1-D04): TLS is REQUIRED for every connection over the network; only the
# container's own socket and loopback (used by the image's init scripts) are exempt.
local    all  supabase_admin                 trust
local    all  all                            peer map=supabase_map
host     all  all             127.0.0.1/32   trust
host     all  all             ::1/128        trust
hostssl  all  all             0.0.0.0/0      scram-sha-256
hostssl  all  all             ::0/0          scram-sha-256
hostnossl all all             0.0.0.0/0      reject
hostnossl all all             ::0/0          reject
