# Jadarat CI — Development Plan §5.3 quality gates (block merge when failing).
# Gate 10 (SAST) runs in codeql.yml. Make the `ci-gates` job and CodeQL required status checks.
# Gate 15 (self-hosted stack) runs once a day at 23:59 Riyadh time in selfhosted-nightly.yml (PO, 14 Oct 2026).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  FORCE_COLOR: '1'

jobs:
  # Worker-kick guard (security review H1, 21 Oct 2026; docs/engineering/background-jobs.md §1a): the web
  # app's GitHub App (repository variable JOBS_KICK_ACTOR = its bot login, e.g. jadarat-jobs-kick[bot]) may
  # start, cancel and re-run workflows of this repository. It may run Jobs only: every job here refuses a run
  # whose triggering actor is that App (any event, re-runs included) and a MANUAL start (workflow_dispatch) by
  # any bot; Dependabot's pull-request runs and schedules are unaffected, and with JOBS_KICK_ACTOR unset the
  # PO and Claude still run it by hand. The job below makes a refused run fail visibly.
  refuse-bot-start:
    name: Refuse a start by the worker-kick app or another bot
    if: github.triggering_actor == vars.JOBS_KICK_ACTOR || (github.event_name == 'workflow_dispatch' && endsWith(github.triggering_actor, '[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refused
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "::error::This workflow refuses runs started by the worker-kick app or, by hand, by any bot ($TRIGGERING_ACTOR, $EVENT_NAME). Only Jobs may be started that way."
          exit 1

  install:
    name: 'Gate 1 · Install (frozen lockfile) + licence check'
    if: github.triggering_actor != vars.JOBS_KICK_ACTOR && (github.event_name != 'workflow_dispatch' || !endsWith(github.triggering_actor, '[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Licence check (no disallowed licences)
        run: pnpm check:licenses

  typecheck:
    name: 'Gate 2 · Type-check'
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    name: 'Gate 2 · Lint + format (incl. RTL and defineAction checks)'
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  unit:
    name: 'Gate 3 · Unit tests + coverage threshold'
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Thresholds (>= 80% lines for packages/*) are enforced by each package's vitest.config.ts.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: '**/coverage/lcov.info'
          retention-days: 14

  boundaries:
    name: 'Gate 4 · Migration conventions + module boundaries'
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Migration naming + rollback presence (ADR 0001, migration-conventions.md)
        run: pnpm check:migrations
      - name: dependency-cruiser (ADR 0001 boundaries, admin/jobs import rules)
        run: pnpm check:deps

  db:
    name: 'Gates 4–6 · Migrations up/down/up, RLS & tenant isolation, DB integration'
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Same major and minor as staging (Supabase, PostgreSQL 17.11). Pinned by digest (multi-arch OCI
        # index of postgres:17 = 17.11, published 2026-09-19): a moved tag can never change what CI tests
        # against. Bump deliberately, together with the hosted projects: docker buildx imagetools inspect postgres:17
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          # Throwaway service container for this run only.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          psql --version
      # First, on the fresh service container: the roles do not exist yet, exactly as on a new hosted project.
      - name: Hosted-Supabase simulation (deploy plan + apply + verify as a NON-superuser migration role)
        run: bash scripts/db-test-hosted-sim.sh
      - name: Test-only Supabase shim → migrations up/down/up → SQL tests (catalog, isolation, claims, hook) → TS integration
        run: bash scripts/db-test.sh
        env:
          DB_TEST_INTEGRATION: '1'

  build:
    name: 'Gate 9 · Build (standalone) + bundle-size budget'
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # No Supabase variables: the app must build and run in its "not configured" state.
      - run: pnpm build
      - run: pnpm --filter @jadarat/suite check:budget

  e2e:
    name: 'Gates 7–8 · E2E smoke (Arabic + English) + accessibility (axe)'
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: pnpm --filter @jadarat/suite exec playwright install --with-deps chromium
      - run: pnpm build
      # Runs against the production standalone server (preview-environment runs follow in T-M1-D03).
      - run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/suite/playwright-report
            apps/suite/test-results
          retention-days: 14

  stories:
    name: 'Gate 8 · Component library (Storybook): every story in Arabic/English × light/dark, axe'
    needs: install
    runs-on: ubuntu-24.04
    # Every story × 2 languages × 2 themes (+ organization colours) takes 7–18 min on a hosted runner and
    # grows with each story; a slow runner hit 20 min while still passing (PR #88, run 40015101691).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: pnpm --filter @jadarat/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @jadarat/ui build-storybook
      - run: pnpm --filter @jadarat/ui test:stories
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: storybook-report
          path: |
            packages/ui/playwright-report
            packages/ui/test-results
          retention-days: 14

  audit:
    name: 'Gate 11 · Dependency vulnerability scan'
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: pnpm audit (fail on high/critical)
        run: pnpm audit --audit-level high

  secrets:
    name: 'Gate 12 · Secret scanning (gitleaks)'
    if: github.triggering_actor != vars.JOBS_KICK_ACTOR && (github.event_name != 'workflow_dispatch' || !endsWith(github.triggering_actor, '[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, verified checksum)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Scan new commits (PR range or pushed range)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="-1"
          fi
          echo "Scanning commits: $range"
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$range"

  iac:
    name: 'Gate 13 · Container / IaC scanning (Trivy)'
    if: github.triggering_actor != vars.JOBS_KICK_ACTOR && (github.event_name != 'workflow_dispatch' || !endsWith(github.triggering_actor, '[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Scans IaC/config in the repo (Dockerfiles, compose, k8s, workflows as they appear).
      # The app and worker images themselves are scanned in gate 15 (selfhosted-nightly.yml, once a day).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  openapi:
    name: 'Gate 14 · OpenAPI breaking-change check (placeholder)'
    if: github.triggering_actor != vars.JOBS_KICK_ACTOR && (github.event_name != 'workflow_dispatch' || !endsWith(github.triggering_actor, '[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No public API yet
        run: |
          # The external REST API (/api/v1) arrives in R2 (ADR 0011). This placeholder FAILS as soon as an
          # OpenAPI document is added, so the real diff check (e.g. oasdiff against main) must land with it.
          specs="$(git ls-files | grep -Ei '(^|/)openapi[^/]*\.(ya?ml|json)$' || true)"
          if [[ -n "$specs" ]]; then
            echo "OpenAPI documents found but no breaking-change check is configured:"; echo "$specs"; exit 1
          fi
          echo "No OpenAPI documents in the repository — nothing to compare (placeholder gate passes)."

  ci-gates:
    name: CI gates
    if: always()
    needs:
      [
        install,
        typecheck,
        lint,
        unit,
        boundaries,
        db,
        build,
        e2e,
        stories,
        audit,
        secrets,
        iac,
        openapi,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A run refused by the worker-kick guard skips every gate, so it fails here too (never "skipped": a
      # skipped required check would count as passed).
      - name: All gates must pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Gate results: $RESULTS"
          for r in $RESULTS; do [[ "$r" == "success" ]] || exit 1; done
