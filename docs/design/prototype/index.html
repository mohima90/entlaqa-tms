<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jadarat Training Prototype</title>
<meta name="description" content="Clickable prototype of five critical Jadarat TMS journeys and the Jadarat Suite shell (Arabic-first, sample data).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ===== Inline copy of docs/design/tokens/tokens.css (keep in sync; source of truth is tokens.json) ===== */
/*
 * Jadarat Design Tokens v1 — CSS custom properties
 * Source of truth: tokens.json (same values). Contrast verified: contrast-report.md
 * Brand tokens (--color-primary*, --color-brand-*) are PLACEHOLDERS until ENTLAQA supplies brand colors.
 * Themes: light on :root; dark via prefers-color-scheme (unless data-theme="light") or data-theme="dark".
 * Language: set lang="ar" or lang="en" on <html>; type tokens switch automatically.
 * Breakpoints cannot be used as var() inside @media; use the documented px values (--bp-* are for JS/reference).
 */
:root {
  /* primitives */
  --color-neutral-0: #FFFFFF;
  --color-neutral-25: #F8FAFA;
  --color-neutral-50: #F2F5F5;
  --color-neutral-100: #E3E9EA;
  --color-neutral-200: #CBD4D6;
  --color-neutral-300: #A7B4B7;
  --color-neutral-400: #7A898D;
  --color-neutral-500: #5B6A6E;
  --color-neutral-600: #465357;
  --color-neutral-700: #333E41;
  --color-neutral-800: #222B2E;
  --color-neutral-850: #192123;
  --color-neutral-900: #121A1C;
  --color-neutral-950: #0B1112;
  /* PLACEHOLDER brand ramp — replace when ENTLAQA brand is supplied */
  --color-brand-50: #E7F3F1;
  --color-brand-100: #C6E4E0;
  --color-brand-200: #94CCC5;
  --color-brand-300: #62B5AB;
  --color-brand-400: #34998F;
  --color-brand-500: #177D74;
  --color-brand-600: #0F665F;
  --color-brand-700: #0C534D;
  --color-brand-800: #09403C;
  --color-brand-900: #07302D;
  --color-brand-950: #041F1D;
  --color-green-50: #E9F6EE;
  --color-green-300: #76D39A;
  --color-green-600: #1D7A43;
  --color-green-700: #166236;
  --color-green-900: #0F2A1B;
  --color-amber-50: #FFF5E0;
  --color-amber-300: #F3BD5A;
  --color-amber-500: #C47600;
  --color-amber-600: #955800;
  --color-amber-900: #2F2311;
  --color-red-50: #FDEEEC;
  --color-red-300: #FF998D;
  --color-red-600: #B42318;
  --color-red-700: #931C14;
  --color-red-900: #3A1714;
  --color-blue-50: #EAF1FB;
  --color-blue-300: #8FBDF5;
  --color-blue-600: #1F5DAA;
  --color-blue-700: #194C8C;
  --color-blue-900: #102338;

  /* semantic (light) */
  --color-bg: var(--color-neutral-50);
  --color-surface: var(--color-neutral-0);
  --color-surface-raised: var(--color-neutral-0);
  --color-surface-sunken: var(--color-neutral-25);
  --color-surface-hover: var(--color-neutral-100);
  --color-surface-selected: var(--color-brand-50);
  --color-text: var(--color-neutral-900);
  --color-text-muted: var(--color-neutral-600);
  --color-text-subtle: var(--color-neutral-500);
  --color-text-disabled: var(--color-neutral-400);
  --color-border: var(--color-neutral-200);
  --color-border-strong: var(--color-neutral-400);
  --color-primary: var(--color-brand-600);
  --color-primary-hover: var(--color-brand-700);
  --color-on-primary: var(--color-neutral-0);
  --color-primary-subtle: var(--color-brand-50);
  --color-primary-text: var(--color-brand-700);
  --color-focus-ring: var(--color-brand-500);
  --color-success: var(--color-green-600);
  --color-success-subtle: var(--color-green-50);
  --color-warning: var(--color-amber-600);
  --color-warning-strong: var(--color-amber-500);
  --color-warning-subtle: var(--color-amber-50);
  --color-danger: var(--color-red-600);
  --color-danger-hover: var(--color-red-700);
  --color-on-danger: var(--color-neutral-0);
  --color-danger-subtle: var(--color-red-50);
  --color-info: var(--color-blue-600);
  --color-info-subtle: var(--color-blue-50);
  --color-inverse-surface: var(--color-neutral-850);
  --color-inverse-text: var(--color-neutral-25);
  --color-overlay: rgba(11, 17, 18, 0.55);

  /* typography */
  --font-family-arabic: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Noto Kufi Arabic", "Segoe UI", Tahoma, "Geeza Pro", system-ui, sans-serif;
  --font-family-latin: "IBM Plex Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-family-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-size-latin-xs: 0.75rem; --font-size-arabic-xs: 0.84375rem;
  --font-size-latin-sm: 0.875rem; --font-size-arabic-sm: 0.96875rem;
  --font-size-latin-md: 1rem; --font-size-arabic-md: 1.125rem;
  --font-size-latin-lg: 1.125rem; --font-size-arabic-lg: 1.25rem;
  --font-size-latin-xl: 1.25rem; --font-size-arabic-xl: 1.40625rem;
  --font-size-latin-2xl: 1.5rem; --font-size-arabic-2xl: 1.6875rem;
  --font-size-latin-3xl: 1.875rem; --font-size-arabic-3xl: 2.0625rem;
  --font-size-latin-4xl: 2.25rem; --font-size-arabic-4xl: 2.5rem;
  --line-height-arabic-body: 1.7;
  --line-height-arabic-heading: 1.45;
  --line-height-latin-body: 1.5;
  --line-height-latin-heading: 1.25;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  /* active script (defaults to Arabic: the product default language) */
  --font-family-base: var(--font-family-arabic);
  --font-size-xs: var(--font-size-arabic-xs);
  --font-size-sm: var(--font-size-arabic-sm);
  --font-size-md: var(--font-size-arabic-md);
  --font-size-lg: var(--font-size-arabic-lg);
  --font-size-xl: var(--font-size-arabic-xl);
  --font-size-2xl: var(--font-size-arabic-2xl);
  --font-size-3xl: var(--font-size-arabic-3xl);
  --font-size-4xl: var(--font-size-arabic-4xl);
  --line-height-body: var(--line-height-arabic-body);
  --line-height-heading: var(--line-height-arabic-heading);
  --letter-spacing-caps: 0; /* never letter-space Arabic: it breaks joining */

  /* spacing (4px grid) */
  --space-0: 0;
  --space-0-5: 0.125rem;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  /* radius */
  --radius-none: 0;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-xl: 16px;
  --radius-full: 9999px;
  /* elevation */
  --elevation-0: none;
  --elevation-1: 0 1px 2px rgba(18, 26, 28, 0.06), 0 1px 3px rgba(18, 26, 28, 0.08);
  --elevation-2: 0 2px 4px rgba(18, 26, 28, 0.06), 0 4px 10px rgba(18, 26, 28, 0.08);
  --elevation-3: 0 6px 12px rgba(18, 26, 28, 0.08), 0 12px 28px rgba(18, 26, 28, 0.12);
  --elevation-4: 0 12px 24px rgba(18, 26, 28, 0.12), 0 24px 56px rgba(18, 26, 28, 0.18);
  /* motion */
  --duration-instant: 0ms;
  --duration-fast: 100ms;
  --duration-base: 160ms;
  --duration-slow: 240ms;
  --duration-slower: 360ms;
  --easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --easing-enter: cubic-bezier(0, 0, 0, 1);
  --easing-exit: cubic-bezier(0.3, 0, 1, 1);
  /* z-index */
  --z-base: 0;
  --z-raised: 10;
  --z-dropdown: 1000;
  --z-sticky: 1100;
  --z-header: 1200;
  --z-overlay: 1300;
  --z-drawer: 1350;
  --z-modal: 1400;
  --z-toast: 1500;
  --z-tooltip: 1600;
  /* breakpoints (reference only) */
  --bp-sm: 360px;
  --bp-md: 600px;
  --bp-lg: 900px;
  --bp-xl: 1200px;
  --bp-2xl: 1440px;
  /* sizes */
  --size-touch-target: 44px;
  --size-control-sm: 32px;
  --size-control-md: 40px;
  --size-control-lg: 48px;
  --size-header-height: 56px;
  --size-sidenav-width: 264px;
  --size-sidenav-collapsed: 72px;
  --size-bottomnav-height: 64px;
  --size-content-max: 1280px;
  --size-text-max: 720px;
  --focus-ring: 0 0 0 2px var(--color-bg), 0 0 0 4px var(--color-focus-ring);
  color-scheme: light;
}

:root:lang(en), [lang="en"] {
  --font-family-base: var(--font-family-latin);
  --font-size-xs: var(--font-size-latin-xs);
  --font-size-sm: var(--font-size-latin-sm);
  --font-size-md: var(--font-size-latin-md);
  --font-size-lg: var(--font-size-latin-lg);
  --font-size-xl: var(--font-size-latin-xl);
  --font-size-2xl: var(--font-size-latin-2xl);
  --font-size-3xl: var(--font-size-latin-3xl);
  --font-size-4xl: var(--font-size-latin-4xl);
  --line-height-body: var(--line-height-latin-body);
  --line-height-heading: var(--line-height-latin-heading);
  --letter-spacing-caps: 0.04em;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: #0E1415;
    --color-surface: #151D1F;
    --color-surface-raised: #1C2628;
    --color-surface-sunken: #0A0F10;
    --color-surface-hover: #223033;
    --color-surface-selected: #12302D;
    --color-text: #E8EEEF;
    --color-text-muted: #AAB7BA;
    --color-text-subtle: #8E9CA0;
    --color-text-disabled: #5E6C70;
    --color-border: #2B3639;
    --color-border-strong: #6B7B7F;
    --color-primary: var(--color-brand-300);
    --color-primary-hover: var(--color-brand-200);
    --color-on-primary: var(--color-brand-950);
    --color-primary-subtle: #12302D;
    --color-primary-text: #86D3C9;
    --color-focus-ring: #86D3C9;
    --color-success: var(--color-green-300);
    --color-success-subtle: var(--color-green-900);
    --color-warning: var(--color-amber-300);
    --color-warning-strong: var(--color-amber-300);
    --color-warning-subtle: var(--color-amber-900);
    --color-danger: var(--color-red-300);
    --color-danger-hover: #FFB3AA;
    --color-on-danger: #2A0906;
    --color-danger-subtle: var(--color-red-900);
    --color-info: var(--color-blue-300);
    --color-info-subtle: var(--color-blue-900);
    --color-inverse-surface: #E8EEEF;
    --color-inverse-text: var(--color-neutral-900);
    --color-overlay: rgba(0, 0, 0, 0.65);
    --elevation-0: none;
    --elevation-1: 0 1px 2px rgba(0, 0, 0, 0.40);
    --elevation-2: 0 2px 6px rgba(0, 0, 0, 0.45);
    --elevation-3: 0 8px 20px rgba(0, 0, 0, 0.50);
    --elevation-4: 0 16px 40px rgba(0, 0, 0, 0.60);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --color-bg: #0E1415;
  --color-surface: #151D1F;
  --color-surface-raised: #1C2628;
  --color-surface-sunken: #0A0F10;
  --color-surface-hover: #223033;
  --color-surface-selected: #12302D;
  --color-text: #E8EEEF;
  --color-text-muted: #AAB7BA;
  --color-text-subtle: #8E9CA0;
  --color-text-disabled: #5E6C70;
  --color-border: #2B3639;
  --color-border-strong: #6B7B7F;
  --color-primary: var(--color-brand-300);
  --color-primary-hover: var(--color-brand-200);
  --color-on-primary: var(--color-brand-950);
  --color-primary-subtle: #12302D;
  --color-primary-text: #86D3C9;
  --color-focus-ring: #86D3C9;
  --color-success: var(--color-green-300);
  --color-success-subtle: var(--color-green-900);
  --color-warning: var(--color-amber-300);
  --color-warning-strong: var(--color-amber-300);
  --color-warning-subtle: var(--color-amber-900);
  --color-danger: var(--color-red-300);
  --color-danger-hover: #FFB3AA;
  --color-on-danger: #2A0906;
  --color-danger-subtle: var(--color-red-900);
  --color-info: var(--color-blue-300);
  --color-info-subtle: var(--color-blue-900);
  --color-inverse-surface: #E8EEEF;
  --color-inverse-text: var(--color-neutral-900);
  --color-overlay: rgba(0, 0, 0, 0.65);
  --elevation-0: none;
  --elevation-1: 0 1px 2px rgba(0, 0, 0, 0.40);
  --elevation-2: 0 2px 6px rgba(0, 0, 0, 0.45);
  --elevation-3: 0 8px 20px rgba(0, 0, 0, 0.50);
  --elevation-4: 0 16px 40px rgba(0, 0, 0, 0.60);
  color-scheme: dark;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-fast: 0ms;
    --duration-base: 0ms;
    --duration-slow: 0ms;
    --duration-slower: 0ms;
  }
}
/* ===== Prototype component styles (built only on tokens above) =====
   Layout concept: suite shell = sticky header + inline-start side nav (right in Arabic) + content column;
   below 900px the nav becomes a drawer and mobile-first roles get a bottom bar. */
:root { --dir: -1; --header-h: var(--size-header-height); --marker-h: 40px; }
[dir="ltr"] { --dir: 1; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-block-start: calc(var(--header-h) + var(--marker-h) + 8px); scroll-padding-block-end: 80px; }
body {
  margin: 0; background: var(--color-bg); color: var(--color-text);
  font-family: var(--font-family-base); font-size: var(--font-size-md); line-height: var(--line-height-body);
  min-height: 100vh;
}
img, svg { max-width: 100%; }
h1, h2, h3, h4 { line-height: var(--line-height-heading); margin: 0; text-wrap: balance; font-weight: var(--font-weight-semibold); }
h1 { font-size: var(--font-size-2xl); }
h2 { font-size: var(--font-size-xl); }
h3 { font-size: var(--font-size-lg); }
h4 { font-size: var(--font-size-md); }
p { margin: 0; }
a { color: var(--color-primary-text); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; border-radius: var(--radius-sm); }
h1[tabindex="-1"]:focus, main[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline: none; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.code { font-family: var(--font-family-mono); font-size: 0.88em; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--color-text-muted); }
.subtle { color: var(--color-text-subtle); font-size: var(--font-size-sm); }
.small { font-size: var(--font-size-sm); }
.xs { font-size: var(--font-size-xs); }
.stack { display: flex; flex-direction: column; gap: var(--space-4); }
.stack-sm { display: flex; flex-direction: column; gap: var(--space-2); }
.row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
.row-between { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.icon { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-lg { width: 28px; height: 28px; }
.icon-xl { width: 48px; height: 48px; stroke-width: 1.6; }
[dir="rtl"] .icon--mirror { transform: scaleX(-1); }

.skip-link { position: absolute; inset-inline-start: var(--space-2); top: -60px; z-index: var(--z-tooltip); background: var(--color-surface-raised); color: var(--color-text); padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); box-shadow: var(--elevation-3); }
.skip-link:focus { top: var(--space-2); }

/* ---------- prototype marker ---------- */
.proto-bar {
  position: sticky; top: 0; z-index: calc(var(--z-header) + 1); min-height: 40px;
  display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
  padding: var(--space-1) var(--space-4);
  background: var(--color-warning-subtle); color: var(--color-text);
  border-block-end: 1px solid var(--color-warning-strong); font-size: var(--font-size-sm);
}
.proto-bar strong { font-weight: var(--font-weight-semibold); }
.proto-bar .proto-actions { margin-inline-start: auto; display: flex; gap: var(--space-1); flex-wrap: wrap; }
.proto-chip { display: inline-flex; align-items: center; gap: var(--space-1); padding: 2px var(--space-2); border-radius: var(--radius-full); border: 1px solid var(--color-warning-strong); color: var(--color-warning); background: var(--color-surface); font-weight: var(--font-weight-medium); font-size: var(--font-size-xs); }
.proto-btn { min-height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--color-border-strong); background: var(--color-surface); cursor: pointer; font-size: var(--font-size-sm); display: inline-flex; align-items: center; gap: var(--space-1); text-decoration: none; color: var(--color-text); }
.proto-btn:hover { background: var(--color-surface-hover); }

/* ---------- header ---------- */
.app-header {
  position: sticky; top: var(--marker-h); z-index: var(--z-header); height: var(--header-h);
  display: flex; align-items: center; gap: var(--space-2); padding-inline: var(--space-3);
  background: var(--color-surface); border-block-end: 1px solid var(--color-border);
}
.brand { display: inline-flex; align-items: baseline; gap: var(--space-2); text-decoration: none; color: var(--color-text); white-space: nowrap; font-weight: var(--font-weight-bold); font-size: var(--font-size-lg); padding-inline: var(--space-1); }
.brand .brand-mark { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: var(--radius-md); background: var(--color-primary); color: var(--color-on-primary); font-size: var(--font-size-sm); align-self: center; }
.brand .brand-module { font-weight: var(--font-weight-regular); color: var(--color-text-muted); font-size: var(--font-size-md); }
.hdr-btn { position: relative; display: inline-grid; place-items: center; width: var(--size-touch-target); height: var(--size-touch-target); border-radius: var(--radius-md); border: 0; background: transparent; cursor: pointer; color: var(--color-text-muted); flex: none; }
.hdr-btn:hover, .hdr-btn[aria-expanded="true"] { background: var(--color-surface-hover); color: var(--color-text); }
.hdr-btn .badge-count { position: absolute; inset-block-start: 4px; inset-inline-end: 2px; min-width: 18px; height: 18px; padding-inline: 4px; border-radius: var(--radius-full); background: var(--color-danger); color: var(--color-on-danger); font-size: 11px; line-height: 18px; font-weight: var(--font-weight-semibold); font-family: var(--font-family-latin); }
.hdr-modules { display: inline-flex; align-items: center; gap: var(--space-1); height: 36px; padding-inline: var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); cursor: pointer; color: var(--color-text-muted); font-size: var(--font-size-sm); }
.hdr-modules:hover, .hdr-modules[aria-expanded="true"] { background: var(--color-surface-hover); color: var(--color-text); }
.hdr-search { flex: 1 1 320px; max-width: 480px; position: relative; margin-inline: var(--space-2); }
.hdr-search input { width: 100%; height: 38px; border-radius: var(--radius-md); border: 1px solid var(--color-border-strong); background: var(--color-surface-sunken); padding-inline: 36px 60px; font-size: var(--font-size-sm); }
.hdr-search .icon { position: absolute; inset-inline-start: 10px; top: 9px; color: var(--color-text-subtle); pointer-events: none; }
.hdr-search kbd { position: absolute; inset-inline-end: 8px; top: 8px; font-family: var(--font-family-latin); font-size: 11px; color: var(--color-text-subtle); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 1px 5px; unicode-bidi: isolate; }
.hdr-spacer { flex: 1; }
.ctx-chip { display: inline-flex; align-items: center; gap: var(--space-1); max-width: 260px; height: 36px; padding-inline: var(--space-3); border-radius: var(--radius-full); border: 1px solid var(--color-border); background: var(--color-surface-sunken); font-size: var(--font-size-sm); color: var(--color-text-muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar { width: 36px; height: 36px; border-radius: var(--radius-full); display: inline-grid; place-items: center; background: var(--color-primary-subtle); color: var(--color-primary-text); font-weight: var(--font-weight-semibold); border: 0; cursor: pointer; font-size: var(--font-size-sm); flex: none; }
.avatar-btn { width: var(--size-touch-target); height: var(--size-touch-target); display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: var(--radius-full); cursor: pointer; padding: 0; }

}

/* ---------- popovers ---------- */
.popover {
  position: fixed; z-index: var(--z-dropdown); inset-block-start: calc(var(--marker-h) + var(--header-h) + 6px);
  width: min(400px, calc(100vw - 16px)); max-height: calc(100vh - var(--marker-h) - var(--header-h) - 24px); overflow: auto;
  background: var(--color-surface-raised); color: var(--color-text); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--elevation-3);
}

.pop-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-block-end: 1px solid var(--color-border); position: sticky; top: 0; background: var(--color-surface-raised); }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--color-border-strong); border-radius: var(--radius-md); overflow: hidden; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; }

.seg label:first-child span { border-inline-start: 0; }
.seg input:checked + span { background: var(--color-primary); color: var(--color-on-primary); }
.seg input:focus-visible + span { outline: 2px solid var(--color-focus-ring); outline-offset: -4px; }
.module-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); padding: var(--space-3); }
.module { display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--color-border); text-decoration: none; color: var(--color-text); min-height: 92px; background: var(--color-surface); }
.module .icon { color: var(--color-text-muted); }
a.module:hover { background: var(--color-surface-hover); }
.module[aria-current="true"] { border-color: var(--color-primary); background: var(--color-surface-selected); }
.module[aria-current="true"] .icon { color: var(--color-primary-text); }
.module.is-locked { background: var(--color-surface-sunken); color: var(--color-text-muted); }
.module .m-name { font-weight: var(--font-weight-semibold); font-size: var(--font-size-sm); }
.module .m-state { font-size: var(--font-size-xs); color: var(--color-text-subtle); display: inline-flex; gap: 4px; align-items: center; }
.notif { display: flex; gap: var(--space-3); padding: var(--space-3); border-radius: var(--radius-md); text-decoration: none; color: var(--color-text); }
.notif:hover { background: var(--color-surface-hover); }
.notif .n-ico { width: 36px; height: 36px; border-radius: var(--radius-full); display: grid; place-items: center; background: var(--color-surface-sunken); color: var(--color-text-muted); flex: none; }
.notif.unread .n-title { font-weight: var(--font-weight-semibold); }
.notif.unread .n-ico { background: var(--color-primary-subtle); color: var(--color-primary-text); }
.notif .n-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-primary); margin-block-start: 8px; flex: none; }
.group-label { padding: var(--space-2) var(--space-3) 0; font-size: var(--font-size-xs); color: var(--color-text-muted); }
.search-results { list-style: none; margin: 0; padding: var(--space-2); }
.search-results li[role="option"] { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); cursor: pointer; }
.search-results li[aria-selected="true"], .search-results li[role="option"]:hover { background: var(--color-surface-selected); }
.search-results .grp { font-size: var(--font-size-xs); color: var(--color-text-muted); padding: var(--space-2) var(--space-3) var(--space-1); }
.mobile-search { padding: var(--space-3); }
.mobile-search input { width: 100%; height: 44px; border-radius: var(--radius-md); border: 1px solid var(--color-border-strong); background: var(--color-surface); padding-inline: var(--space-3); }

/* ---------- layout ---------- */
.shell { display: grid; grid-template-columns: var(--size-sidenav-width) minmax(0, 1fr); min-height: calc(100vh - var(--marker-h) - var(--header-h)); }
.sidenav {
  position: sticky; top: calc(var(--marker-h) + var(--header-h)); align-self: start;
  height: calc(100vh - var(--marker-h) - var(--header-h)); overflow-y: auto;
  background: var(--color-surface); border-inline-end: 1px solid var(--color-border);

}
.nav-group-label { font-size: var(--font-size-xs); color: var(--color-text-muted); padding: var(--space-3) var(--space-3) var(--space-1); letter-spacing: var(--letter-spacing-caps); }

.nav-item .tag { margin-inline-start: auto; font-size: var(--font-size-xs); color: var(--color-text-subtle); border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 0 6px; }
.nav-item .count { margin-inline-start: auto; font-size: var(--font-size-xs); background: var(--color-primary); color: var(--color-on-primary); border-radius: var(--radius-full); min-width: 22px; text-align: center; padding: 0 6px; font-family: var(--font-family-latin); }
.nav-modules { display: none; border: 0; background: transparent; width: 100%; cursor: pointer; }

.nav-drawer-head { display: none; }
.content { min-width: 0; padding: var(--space-6) var(--space-6) var(--space-12); }
.content-inner { max-width: var(--size-content-max); margin-inline: auto; display: flex; flex-direction: column; gap: var(--space-6); }
.content-narrow { max-width: 520px; margin-inline: auto; width: 100%; }
.scrim { position: fixed; inset: 0; background: var(--color-overlay); z-index: var(--z-overlay); }
@media (max-width: 1199px) and (min-width: 900px) {
  .shell { grid-template-columns: 220px minmax(0, 1fr); }
}
@media (max-width: 899px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidenav {
    position: fixed; top: 0; inset-inline-start: 0; bottom: 0; height: 100%; width: min(300px, 86vw); z-index: var(--z-drawer);
    box-shadow: var(--elevation-4); transform: translateX(calc(-100% * var(--dir))); visibility: hidden;
    transition: transform var(--duration-slow) var(--easing-standard), visibility 0s linear var(--duration-slow);
    padding-block-start: env(safe-area-inset-top, 0px);
  }
  .sidenav.is-open { transform: none; visibility: visible; transition: transform var(--duration-slow) var(--easing-enter); }
  .nav-modules { display: flex; }
  .nav-drawer-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-2); }
  .content { padding: var(--space-4) var(--space-4) calc(var(--size-bottomnav-height) + var(--space-8)); }
}

/* ---------- bottom nav ---------- */
.bottom-nav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: var(--z-sticky); display: none;
  background: var(--color-surface); border-block-start: 1px solid var(--color-border);
  padding-block-end: env(safe-area-inset-bottom, 0px);
}

.bottom-nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: var(--size-bottomnav-height); text-decoration: none; color: var(--color-text-muted); font-size: 12px; text-align: center; padding-inline: 2px; position: relative; }
:lang(ar) .bottom-nav a { font-size: 12.5px; }
.bottom-nav a[aria-current="page"] { color: var(--color-primary-text); font-weight: var(--font-weight-semibold); }
.bottom-nav a[aria-current="page"]::before { content: ""; position: absolute; top: 0; inset-inline: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--color-primary); }
.bottom-nav .bn-center .bn-ico { width: 44px; height: 44px; border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-on-primary); display: grid; place-items: center; margin-block-start: -14px; box-shadow: var(--elevation-2); }
.bottom-nav .bn-badge { position: absolute; top: 6px; inset-inline-start: calc(50% + 6px); background: var(--color-danger); color: var(--color-on-danger); border-radius: var(--radius-full); font-size: 10px; min-width: 16px; line-height: 16px; font-family: var(--font-family-latin); }
@media (max-width: 899px) { body.has-bottom-nav .bottom-nav { display: block; } }

/* ---------- page header ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-3); }
.page-head .eyebrow { font-size: var(--font-size-sm); color: var(--color-text-muted); }
.breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1); font-size: var(--font-size-sm); color: var(--color-text-muted); list-style: none; padding: 0; margin: 0 0 var(--space-1); }
.breadcrumb .icon { width: 14px; height: 14px; }

/* ---------- surfaces ---------- */
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5); min-width: 0; }
.card-flush { padding: 0; overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; padding: var(--space-4) var(--space-5); border-block-end: 1px solid var(--color-border); }
.card-body { padding: var(--space-4) var(--space-5); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: var(--space-4); }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: var(--space-4); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: var(--space-3); }
.kpi { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-1); }
.kpi .v { font-size: var(--font-size-2xl); font-weight: var(--font-weight-semibold); font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi.is-attn { border-color: var(--color-warning-strong); }
.dl { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr); gap: var(--space-2) var(--space-4); margin: 0; }
.dl dt { color: var(--color-text-muted); font-size: var(--font-size-sm); }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 420px) { .dl { grid-template-columns: minmax(0, 1fr); gap: 0 0; } .dl dd { margin-block-end: var(--space-3); } }
.divider { height: 1px; background: var(--color-border); border: 0; margin: 0; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: var(--size-control-md); padding-inline: var(--space-4); border-radius: var(--radius-md); border: 1px solid transparent; font-weight: var(--font-weight-medium); font-size: var(--font-size-sm); cursor: pointer; text-decoration: none; white-space: nowrap; transition: background var(--duration-fast) var(--easing-standard); }
.btn-lg { min-height: var(--size-control-lg); font-size: var(--font-size-md); padding-inline: var(--space-6); }
.btn-block { width: 100%; }
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-secondary { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border-strong); }
.btn-secondary:hover { background: var(--color-surface-hover); }
.btn-ghost { background: transparent; color: var(--color-primary-text); }
.btn-ghost:hover { background: var(--color-surface-hover); }
.btn-danger { background: var(--color-danger); color: var(--color-on-danger); }
.btn-danger:hover { background: var(--color-danger-hover); }
.btn-danger-ghost { background: transparent; color: var(--color-danger); border-color: var(--color-border-strong); }
.btn-danger-ghost:hover { background: var(--color-danger-subtle); }
.btn[aria-disabled="true"] { opacity: 0.6; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: var(--size-touch-target); height: var(--size-touch-target); border-radius: var(--radius-md); border: 0; background: transparent; color: var(--color-text-muted); cursor: pointer; }
.icon-btn:hover { background: var(--color-surface-hover); color: var(--color-text); }

/* ---------- badges & alerts ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px var(--space-2); border-radius: var(--radius-full); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); white-space: nowrap; border: 1px solid transparent; }
.badge .icon { width: 14px; height: 14px; }
.b-neutral { background: var(--color-surface-sunken); color: var(--color-text-muted); border-color: var(--color-border); }
.b-info { background: var(--color-info-subtle); color: var(--color-info); }
.b-success { background: var(--color-success-subtle); color: var(--color-success); }
.b-warning { background: var(--color-warning-subtle); color: var(--color-warning); }
.b-danger { background: var(--color-danger-subtle); color: var(--color-danger); }
.b-primary { background: var(--color-primary-subtle); color: var(--color-primary-text); }
.alert { display: flex; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-lg); border: 1px solid; align-items: flex-start; }
.alert .icon { margin-block-start: 3px; }
.alert-info { background: var(--color-info-subtle); border-color: var(--color-info); }
.alert-info > .icon { color: var(--color-info); }
.alert-success { background: var(--color-success-subtle); border-color: var(--color-success); }
.alert-success > .icon { color: var(--color-success); }
.alert-warning { background: var(--color-warning-subtle); border-color: var(--color-warning-strong); }
.alert-warning > .icon { color: var(--color-warning); }
.alert-danger { background: var(--color-danger-subtle); border-color: var(--color-danger); }
.alert-danger > .icon { color: var(--color-danger); }
.alert .a-title { font-weight: var(--font-weight-semibold); }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.field label, .field .label, fieldset legend { font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); }
.field .hint { font-size: var(--font-size-xs); color: var(--color-text-muted); }
.req { color: var(--color-text-muted); font-weight: var(--font-weight-regular); font-size: var(--font-size-xs); }
.input, .select, .textarea { width: 100%; min-height: var(--size-control-md); border: 1px solid var(--color-border-strong); border-radius: var(--radius-md); background: var(--color-surface); padding: var(--space-2) var(--space-3); font-size: var(--font-size-sm); }
.textarea { min-height: 88px; resize: vertical; }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 1px; }
.input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--color-danger); border-width: 2px; }
.field-error { color: var(--color-danger); font-size: var(--font-size-xs); display: flex; gap: 4px; align-items: center; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: var(--space-4); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.choice { display: flex; gap: var(--space-2); align-items: flex-start; min-height: 32px; cursor: pointer; }
.choice input { width: 18px; height: 18px; margin-block-start: 4px; accent-color: var(--color-primary); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip-radio { position: relative; }
.chip-radio input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip-radio span { display: inline-flex; align-items: center; min-height: 36px; padding-inline: var(--space-3); border-radius: var(--radius-full); border: 1px solid var(--color-border-strong); font-size: var(--font-size-sm); background: var(--color-surface); }
.chip-radio input:checked + span { background: var(--color-primary-subtle); border-color: var(--color-primary); color: var(--color-primary-text); font-weight: var(--font-weight-semibold); }
.chip-radio input:focus-visible + span { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }

/* ---------- stepper ---------- */
.stepper { display: flex; gap: var(--space-2); list-style: none; margin: 0; padding: 0; }
.stepper li { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); font-size: var(--font-size-xs); color: var(--color-text-muted); }
.stepper li::before { content: ""; height: 4px; border-radius: 2px; background: var(--color-border); }
.stepper li.done::before, .stepper li.current::before { background: var(--color-primary); }
.stepper li.current { color: var(--color-text); font-weight: var(--font-weight-semibold); }

/* ---------- lists / tables ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: var(--font-size-sm); }
.tbl th { text-align: start; font-weight: var(--font-weight-medium); color: var(--color-text-muted); background: var(--color-surface-sunken); padding: var(--space-2) var(--space-4); border-block-end: 1px solid var(--color-border); white-space: nowrap; }
.tbl td { padding: var(--space-3) var(--space-4); border-block-end: 1px solid var(--color-border); vertical-align: top; }
.tbl tr:last-child td { border-block-end: 0; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: var(--space-4) var(--space-5); border-block-end: 1px solid var(--color-border); }
.list > li:last-child { border-block-end: 0; }
.tpl { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); cursor: pointer; text-align: start; width: 100%; }
.tpl:hover { border-color: var(--color-border-strong); background: var(--color-surface-sunken); }
.tpl.is-selected { border-color: var(--color-primary); background: var(--color-surface-selected); box-shadow: inset 0 0 0 1px var(--color-primary); }
.tpl .t-ico { width: 40px; height: 40px; border-radius: var(--radius-md); display: grid; place-items: center; background: var(--color-primary-subtle); color: var(--color-primary-text); flex: none; }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--space-2); }
.checks li { display: flex; gap: var(--space-2); align-items: flex-start; font-size: var(--font-size-sm); }
.checks .ok { color: var(--color-success); }
.day-row { display: grid; grid-template-columns: 70px minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-3); align-items: start; padding: var(--space-3) 0; border-block-end: 1px solid var(--color-border); }
.day-row:last-child { border-block-end: 0; }
.day-row .d-label { font-weight: var(--font-weight-semibold); font-size: var(--font-size-sm); padding-block-start: 30px; }
@media (max-width: 700px) {
  .day-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .day-row .d-label { grid-column: 1 / -1; padding-block-start: 0; }
  .day-row .d-date { grid-column: 1 / -1; }
}
.conflict { border: 1px solid; border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.conflict.hard { border-color: var(--color-danger); background: var(--color-danger-subtle); }
.conflict.soft { border-color: var(--color-warning-strong); background: var(--color-warning-subtle); }
.conflict .c-head { display: flex; gap: var(--space-2); align-items: flex-start; }
.conflict.hard .c-head > .icon { color: var(--color-danger); }
.conflict.soft .c-head > .icon { color: var(--color-warning); }
.conflict .c-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.form-foot { display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: space-between; align-items: center; padding-block-start: var(--space-2); }
.form-foot .row { margin-inline-start: auto; }
.sticky-foot { position: sticky; bottom: 0; background: var(--color-surface); border-block-start: 1px solid var(--color-border); padding: var(--space-3) var(--space-5); z-index: var(--z-raised); }
@media (max-width: 899px) { body.has-bottom-nav .sticky-foot { bottom: calc(var(--size-bottomnav-height) + env(safe-area-inset-bottom, 0px)); } }

/* ---------- approvals ---------- */
.appr { display: flex; flex-direction: column; gap: var(--space-3); }
.appr.is-highlight { border-inline-start: 4px solid var(--color-primary); }
.appr .who { display: flex; gap: var(--space-3); align-items: center; }
.ctx-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: var(--space-2) var(--space-4); list-style: none; padding: 0; margin: 0; }
.ctx-list li { display: flex; gap: var(--space-2); align-items: flex-start; font-size: var(--font-size-sm); }
.ctx-list .icon { width: 18px; height: 18px; margin-block-start: 3px; }
.ctx-ok { color: var(--color-success); }
.ctx-warn { color: var(--color-warning); }
.appr-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.appr-actions .btn { min-width: 120px; min-height: var(--size-touch-target); }
.decided { display: flex; gap: var(--space-2); align-items: center; }

/* ---------- WhatsApp-style mock (tokens only; not WhatsApp branding) ---------- */
.phone { width: 100%; max-width: 380px; margin-inline: auto; border: 1px solid var(--color-border-strong); border-radius: 28px; overflow: hidden; background: var(--color-surface-sunken); box-shadow: var(--elevation-3); }
.phone-top { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--color-surface); border-block-end: 1px solid var(--color-border); }
.phone-top .avatar { background: var(--color-primary); color: var(--color-on-primary); }
.chat { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-4) var(--space-3); min-height: 440px; }
.bubble { max-width: 88%; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 14px; padding: var(--space-3); font-size: var(--font-size-sm); align-self: flex-start; box-shadow: var(--elevation-1); }
.bubble.me { align-self: flex-end; background: var(--color-primary-subtle); border-color: var(--color-primary-subtle); }
.bubble .b-time { display: block; text-align: end; font-size: 11px; color: var(--color-text-subtle); margin-block-start: 4px; }
.bubble .b-title { font-weight: var(--font-weight-semibold); margin-block-end: 4px; }
.qr-actions { display: flex; flex-direction: column; gap: 1px; align-self: flex-start; width: 88%; border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border); }
.qr-actions button { min-height: 44px; border: 0; background: var(--color-surface); color: var(--color-primary-text); font-weight: var(--font-weight-semibold); cursor: pointer; font-size: var(--font-size-sm); display: inline-flex; gap: var(--space-2); align-items: center; justify-content: center; }
.qr-actions button + button { border-block-start: 1px solid var(--color-border); }
.qr-actions button:hover { background: var(--color-surface-hover); }
.qr-actions button[disabled] { color: var(--color-text-disabled); cursor: default; }
.chat-day { align-self: center; font-size: 11px; color: var(--color-text-muted); background: var(--color-surface); border-radius: var(--radius-full); padding: 2px 10px; border: 1px solid var(--color-border); }

/* ---------- mobile learner / scan ---------- */
.today-card { border: 1px solid var(--color-primary); background: var(--color-surface); border-radius: var(--radius-xl); overflow: hidden; }
.today-card .tc-head { background: var(--color-primary-subtle); color: var(--color-primary-text); padding: var(--space-3) var(--space-5); font-weight: var(--font-weight-semibold); font-size: var(--font-size-sm); display: flex; justify-content: space-between; gap: var(--space-2); flex-wrap: wrap; }
.today-card .tc-body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); }
.viewfinder { position: relative; aspect-ratio: 1 / 1; max-width: 100%; width: 100%; border-radius: var(--radius-xl); background: var(--color-neutral-900); overflow: hidden; display: grid; place-items: center; }
.viewfinder .vf-frame { position: absolute; inset: 18%; border-radius: 12px; }
.viewfinder .vf-c { position: absolute; width: 24%; height: 24%; border: 4px solid var(--color-neutral-0); }
.viewfinder .vf-c.c1 { inset-block-start: 0; inset-inline-start: 0; border-inline-end: 0; border-block-end: 0; border-start-start-radius: 12px; }
.viewfinder .vf-c.c2 { inset-block-start: 0; inset-inline-end: 0; border-inline-start: 0; border-block-end: 0; border-start-end-radius: 12px; }
.viewfinder .vf-c.c3 { inset-block-end: 0; inset-inline-start: 0; border-inline-end: 0; border-block-start: 0; border-end-start-radius: 12px; }
.viewfinder .vf-c.c4 { inset-block-end: 0; inset-inline-end: 0; border-inline-start: 0; border-block-start: 0; border-end-end-radius: 12px; }
.viewfinder .vf-line { position: absolute; inset-inline: 20%; height: 2px; background: var(--color-brand-300); top: 20%; animation: scan 2.2s var(--easing-standard) infinite alternate; }
@keyframes scan { to { top: 80%; } }
@media (prefers-reduced-motion: reduce) { .viewfinder .vf-line { animation: none; top: 50%; } }
.viewfinder .vf-qr { width: 46%; opacity: 0.35; }
.viewfinder .vf-hint { position: absolute; bottom: var(--space-3); inset-inline: var(--space-3); text-align: center; color: var(--color-neutral-0); font-size: var(--font-size-sm); }
.result { text-align: center; display: flex; flex-direction: column; gap: var(--space-3); align-items: center; padding: var(--space-6) var(--space-4); }
.result .r-ico { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; }
.result.ok .r-ico { background: var(--color-success-subtle); color: var(--color-success); }
.result.bad .r-ico { background: var(--color-danger-subtle); color: var(--color-danger); }
.result.warn .r-ico { background: var(--color-warning-subtle); color: var(--color-warning); }
.progress { height: 8px; border-radius: var(--radius-full); background: var(--color-surface-hover); overflow: hidden; width: 100%; }
.progress > span { display: block; height: 100%; background: var(--color-primary); border-radius: inherit; }
.sim-panel { border: 1px dashed var(--color-warning-strong); border-radius: var(--radius-lg); padding: var(--space-3); background: var(--color-warning-subtle); display: flex; flex-direction: column; gap: var(--space-2); }
.sim-panel .label { font-size: var(--font-size-xs); font-weight: var(--font-weight-semibold); color: var(--color-warning); }
.qr-live { width: 180px; height: 180px; background: var(--color-neutral-0); padding: 10px; border-radius: var(--radius-md); border: 1px solid var(--color-border); }

/* ---------- TNA ---------- */
.summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: var(--space-3); }
.emp { border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); overflow: hidden; }
.emp-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); width: 100%; background: transparent; border: 0; cursor: pointer; text-align: start; min-height: 60px; }
.emp-head:hover { background: var(--color-surface-sunken); }
.emp-head .chev { transition: transform var(--duration-base) var(--easing-standard); margin-inline-start: auto; }
.emp-head[aria-expanded="true"] .chev { transform: rotate(180deg); }
.emp-body { border-block-start: 1px solid var(--color-border); }
.need { display: grid; grid-template-columns: minmax(0, 1fr) 150px 150px 44px; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-4); border-block-end: 1px solid var(--color-border); }
.need:last-child { border-block-end: 0; }
@media (max-width: 760px) {
  .need { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 44px; }
  .need .n-main { grid-column: 1 / -1; }
}
.need .n-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.prio-critical { color: var(--color-danger); }
.dialog { border: 0; padding: 0; border-radius: var(--radius-xl); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--color-surface-raised); color: var(--color-text); box-shadow: var(--elevation-4); }
.dialog::backdrop { background: var(--color-overlay); }
.dialog form { display: flex; flex-direction: column; }
.dlg-head { padding: var(--space-5) var(--space-5) var(--space-3); display: flex; justify-content: space-between; gap: var(--space-3); align-items: flex-start; }
.dlg-body { padding: 0 var(--space-5) var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); overflow-y: auto; }
.dlg-foot { padding: var(--space-4) var(--space-5); border-block-start: 1px solid var(--color-border); display: flex; gap: var(--space-2); justify-content: flex-end; flex-wrap: wrap; }

.public-top { background: var(--color-surface); border-block-end: 1px solid var(--color-border); padding: var(--space-3) var(--space-4); }
.public-top .inner { max-width: 760px; margin-inline: auto; display: flex; align-items: center; gap: var(--space-3); justify-content: space-between; flex-wrap: wrap; }
.tenant-logo { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius-md); border: 2px solid var(--color-primary); color: var(--color-primary-text); font-weight: var(--font-weight-bold); }
.public-main { max-width: 760px; margin-inline: auto; padding: var(--space-6) var(--space-4) var(--space-12); display: flex; flex-direction: column; gap: var(--space-5); }
.verdict { display: flex; gap: var(--space-4); align-items: center; padding: var(--space-5); border-radius: var(--radius-xl); border: 2px solid; }
.verdict.valid { border-color: var(--color-success); background: var(--color-success-subtle); }
.verdict.valid .v-ico { color: var(--color-success); }
.verdict.expired { border-color: var(--color-warning-strong); background: var(--color-warning-subtle); }
.verdict.expired .v-ico { color: var(--color-warning); }
.verdict.revoked { border-color: var(--color-danger); background: var(--color-danger-subtle); }
.verdict.revoked .v-ico { color: var(--color-danger); }
.verdict h1 { font-size: var(--font-size-xl); }

/* ---------- landing ---------- */
.landing { max-width: 1120px; margin-inline: auto; padding: var(--space-8) var(--space-4) var(--space-16); display: flex; flex-direction: column; gap: var(--space-8); }
.hero { display: grid; gap: var(--space-4); max-width: 760px; }
.hero h1 { font-size: var(--font-size-3xl); }
.hero p { font-size: var(--font-size-lg); color: var(--color-text-muted); max-width: 62ch; }
.journeys { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: var(--space-4); list-style: none; margin: 0; padding: 0; }
.journey { display: flex; flex-direction: column; gap: var(--space-3); height: 100%; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5); }
.journey .j-id { font-family: var(--font-family-latin); font-weight: var(--font-weight-semibold); color: var(--color-primary-text); background: var(--color-primary-subtle); border-radius: var(--radius-md); padding: 2px 8px; font-size: var(--font-size-sm); }
.journey .j-meta { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.journey .j-links { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-block-start: auto; }
.cert-thumb { display: flex; gap: var(--space-3); align-items: center; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); padding: var(--space-3); background: var(--color-surface-sunken); }
.cert-thumb svg.qr { width: 64px; height: 64px; background: var(--color-neutral-0); padding: 4px; border-radius: 4px; flex: none; }

/* ---------- states demo ---------- */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-2); padding: var(--space-8) var(--space-4); color: var(--color-text-muted); }
.empty .e-ico { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--color-surface-sunken); color: var(--color-text-muted); }
.empty h3 { color: var(--color-text); font-size: var(--font-size-md); }
.skel { background: linear-gradient(90deg, var(--color-surface-hover) 0%, var(--color-surface-sunken) 50%, var(--color-surface-hover) 100%); background-size: 200% 100%; border-radius: var(--radius-sm); height: 14px; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

/* ---------- toast ---------- */
.toasts { position: fixed; z-index: var(--z-toast); inset-inline: 0; bottom: var(--space-4); display: flex; flex-direction: column; align-items: center; gap: var(--space-2); pointer-events: none; padding-inline: var(--space-3); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: var(--space-3); max-width: 560px; width: 100%; background: var(--color-inverse-surface); color: var(--color-inverse-text); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); box-shadow: var(--elevation-3); font-size: var(--font-size-sm); }
.toast button { margin-inline-start: auto; background: transparent; border: 1px solid currentColor; color: inherit; border-radius: var(--radius-md); min-height: 36px; padding-inline: var(--space-3); cursor: pointer; font-weight: var(--font-weight-semibold); }
.toast button:focus-visible { outline-color: var(--color-inverse-text); }

/* ---------- wrapping safety for long labels (EN/AR at 360px) ---------- */
.btn { max-width: 100%; }
.c-actions .btn, .j-links .btn, .appr-actions .btn, .form-foot .btn { white-space: normal; text-align: start; padding-block: 6px; }

@media (min-width: 1100px) { .grid-sched { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }

  /* ------------------------------------------------------------------ J1 */
  function j1() { if (!S.j1) S.j1 = newJ1('lead'); return S.j1; }
  function overlaps(a1, a2, b1, b2) { return mins(a1) < mins(b2) && mins(b1) < mins(a2); }
  function prayerBreak(v) { var m = mins(VENUES[v].prayer.dhuhr) - 5; m = m - (m % 15); return [hmFrom(m), hmFrom(m + 30)]; }
  function j1Conflicts() {
    var j = j1(), out = [], ins = INSTR[j.instructor], ven = VENUES[j.venue];
    j.days.forEach(function (d, i) {
      if (dow(d.date) === 5 || dow(d.date) === 6) out.push({ type: 'hard', kind: 'weekend', day: i });
      ins.busy.forEach(function (b) { if (b.date === d.date && overlaps(d.start, d.end, b.start, b.end)) out.push({ type: 'hard', kind: 'instructor', day: i, b: b }); });
      if (mins(d.end) <= mins(d.start)) out.push({ type: 'hard', kind: 'time', day: i });
    });
    if (ROOMS[j.room].cap < j.cap) out.push({ type: 'hard', kind: 'capacity' });
    var pd = j.days.filter(function (d) { return mins(d.start) < mins(ven.prayer.dhuhr) && mins(ven.prayer.dhuhr) < mins(d.end); });
    if (pd.length && !j.prayerBreak && !j.override) out.push({ type: 'soft', kind: 'prayer', count: pd.length, all: pd.length === j.days.length });
    var pa = j.days.filter(function (d) { return mins(d.start) < mins(ven.prayer.asr) && mins(ven.prayer.asr) < mins(d.end); });
    if (pa.length && !j.override) out.push({ type: 'soft', kind: 'asr', count: pa.length });
    return out;
  }

  }

  function closeDialog() { var rf = S.ui.returnFocus; var d = $('#dlg'); if (d && d.open) d.close(); S.ui.dialog = null; S.ui.focusAfter = rf; rerender(); }

  var SUBMIT = {
    'reject': function (form) {
      var sel = form.querySelector('input[name="rj"]:checked');
      if (!sel) { S.ui.dialog.err = true; rerender(); return; }
      var s = j2(), id = S.ui.dialog.id, a = APPR.filter(function (x) { return x.id === id; })[0];
      var label = sel.parentNode.textContent.trim();
      s.dec[id] = 'rejected'; s.reasons[id] = label; s.channel = s.channel || {}; s.channel[id] = 'web';
      var d = $('#dlg'); if (d && d.open) d.close();
      S.ui.dialog = null; S.ui.focusAfter = 'pend-h'; rerender();
      var m = T('رُفض طلب ', 'Rejected ') + L(a.who) + T(' وأُرسل السبب إليه.', '\'s request and sent the reason.');
      toast(m, function () { delete s.dec[id]; delete s.reasons[id]; S.ui.focusAfter = 'reject-' + id; rerender(); }); announce(m);
    },
    'add-need': function (form) {
      var v = { emp: $('#an-emp').value, c: $('#an-course').value, prio: (form.querySelector('input[name="an-prio"]:checked') || {}).value || 'medium', q: $('#an-q').value, just: $('#an-just').value.trim() };
      var e = {};
      if (!v.emp) e.emp = T('اختيار الموظف مطلوب.', 'Choose an employee.');
      if (!v.c) e.c = T('اختيار الدورة مطلوب.', 'Choose a course.');
      if (v.prio === 'critical' && !v.just) e.just = T('المبرر مطلوب للاحتياجات ذات الأولوية الحرجة.', 'A justification is required for critical needs.');
      if (Object.keys(e).length) { S.ui.dialog.err = e; S.ui.dialog.v = v; var d0 = $('#dlg'); if (d0 && d0.open) d0.close(); rerender(); return; }
      var s = j4(), id = 'n' + (++nid);
      s.needs.push({ id: id, emp: v.emp, c: v.c, src: 'manager', det: null, just: v.just || T('أضافه المدير المباشر', 'Added by the line manager'), prio: v.prio, q: v.q });
      s.open[v.emp] = true;
      var d = $('#dlg'); if (d && d.open) d.close();
      S.ui.dialog = null; S.ui.focusAfter = 'p-' + id; rerender();
      var emp = TEAM.filter(function (t) { return t.id === v.emp; })[0];
      var m = T('أُضيف احتياج «', 'Added "') + L(COURSES[v.c]) + T('» لـ ', '" for ') + L(emp) + T(' بأولوية ', ' with priority ') + L(PRIO[v.prio]) + '.';
      toast(esc(m)); announce(m);
    },
    'remove-need': function () {
      var r = $('#rm-reason').value.trim();
      if (!r) { S.ui.dialog.err = true; var d0 = $('#dlg'); if (d0 && d0.open) d0.close(); rerender(); return; }
      var id = S.ui.dialog.id; var d = $('#dlg'); if (d && d.open) d.close(); S.ui.dialog = null; removeNeed(id, r);
    },
    'verify': function () {
      var raw = $('#v-num').value.trim().toUpperCase().replace(/\s+/g, '').replace(/[٠-٩]/g, function (d) { return String(d.charCodeAt(0) - 1632); });
      S.j5.typed = raw;
      var c = CERTS[raw];
      if (!c) { S.j5.err = true; S.ui.focusAfter = 'v-num'; rerender(); announce(T('لم نعثر على شهادة بهذا الرقم.', 'No certificate found with this number.')); return; }
      S.j5.err = false; S.j5.lookup = raw; go({ valid: 'j5', expired: 'j5-expired', revoked: 'j5-revoked' }[c.state]);
    },
    'j1-details': function () { A['j1-next2'](); },
    'none': function () {}
  };

  /* ------------------------------------------------------------------ events */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (t && A[t.getAttribute('data-act')]) { A[t.getAttribute('data-act')](t, e); return; }
    var opt = e.target.closest('.search-results li[role="option"]');
    if (opt) { pickSearch(+opt.getAttribute('data-idx')); return; }
    if (S.ui.pop && !e.target.closest('.popover') && !e.target.closest('[data-act="pop"]')) { S.ui.pop = null; rerender(); }
    var sp = $('#search-pop'); if (sp && !sp.hidden && !e.target.closest('.hdr-search')) { sp.hidden = true; $('#search-input').setAttribute('aria-expanded', 'false'); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, k = el.getAttribute('data-change'); if (!k) return;
    var v = el.value;
    if (k === 'lang' || k === 'cal' || k === 'digits' || k === 'theme') { S[k] = v; savePrefs(); S.ui.focusAfter = el.id || null; rerender(); var sel = document.querySelector('input[data-change="' + k + '"][value="' + v + '"]'); if (sel) sel.focus(); return; }
    if (k === 'role') { S.role = v; S.ui.pop = null; S.ui.focusAfter = 'btn-user'; if (route() !== 'shell') go('shell'); else rerender(); announce(T('يعرض النموذج الآن دور: ', 'Now viewing as: ') + L(ROLES[v])); return; }
    if (k === 'branch') { S.branch = v; rerender(); var b = document.querySelector('input[name="branch"][value="' + v + '"]'); if (b) b.focus(); return; }
    if (k === 'j1-field') {
      var j = j1(), key = el.getAttribute('data-key');
      j[key] = (key === 'cap' || key === 'min' || key === 'hours') ? +v : v;
      if (key === 'nameAr' || key === 'nameEn' || key === 'obj' || key === 'code') return; // no re-render needed while typing
      rerender(); if (key === 'instructor' || key === 'room') announce(conflictSummary()); return;
    }
    if (k === 'j1-venue') { var jj = j1(); jj.venue = v; jj.room = VENUES[v].rooms[0]; rerender(); announce(conflictSummary()); return; }
    if (k === 'j1-day') { var jd = j1(); if (v) jd.days[+el.getAttribute('data-i')][el.getAttribute('data-key')] = v; rerender(); announce(conflictSummary()); return; }
    if (k === 'j1-open') { j1().openEnroll = el.checked; return; }
    if (k === 'j4-prio' || k === 'j4-q') {
      var n = j4().needs.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
      if (k === 'j4-prio') n.prio = v; else n.q = v;
      j4().savedAt = new Date().toTimeString().slice(0, 5);
      rerender(); announce(T('حُفظت المسودة.', 'Draft saved.'));
    }
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.getAttribute('data-change') === 'j1-field') { var key = el.getAttribute('data-key'); if (key === 'nameAr' || key === 'nameEn' || key === 'obj' || key === 'code') j1()[key] = el.value; }
    if (el.id === 'search-input') { var sp = $('#search-pop'); sp.hidden = false; el.setAttribute('aria-expanded', 'true'); runSearch(el, $('#search-list')); }
    if (el.id === 'm-search-input') runSearch(el, $('#m-search-list'));
  });
  document.addEventListener('focusin', function (e) {
    if (e.target.id === 'search-input') { var sp = $('#search-pop'); sp.hidden = false; e.target.setAttribute('aria-expanded', 'true'); runSearch(e.target, $('#search-list')); }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target, k = f.getAttribute('data-submit'); if (!k) return;
    e.preventDefault(); if (SUBMIT[k]) SUBMIT[k](f);
  });
  document.addEventListener('cancel', function (e) { if (e.target.id === 'dlg') { e.preventDefault(); closeDialog(); } }, true);
  document.addEventListener('keydown', function (e) {
    var tg = e.target;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openSearch(); return; }
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(tg.tagName)) { e.preventDefault(); openSearch(); return; }
    if (tg.id === 'search-input' || tg.id === 'm-search-input') {
      var list = tg.id === 'search-input' ? $('#search-list') : $('#m-search-list');
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault(); if (!sResults.length) return;
        sIdx = (sIdx + (e.key === 'ArrowDown' ? 1 : -1) + sResults.length) % sResults.length;
        list.querySelectorAll('[role="option"]').forEach(function (o, i) { o.setAttribute('aria-selected', String(i === sIdx)); });
        tg.setAttribute('aria-activedescendant', list.id + '-o' + sIdx);
        var cur = document.getElementById(list.id + '-o' + sIdx); if (cur) cur.scrollIntoView({ block: 'nearest' });
        return;
      }
      if (e.key === 'Enter') { e.preventDefault(); pickSearch(sIdx); return; }
      if (e.key === 'Escape') { e.preventDefault(); if (tg.id === 'search-input') { $('#search-pop').hidden = true; tg.setAttribute('aria-expanded', 'false'); tg.value = ''; } else closePop(); return; }
    }
    if (e.key === 'Escape') {
      if (S.ui.pop) { e.preventDefault(); closePop(); return; }
      if (S.ui.drawer) { e.preventDefault(); A['drawer-close'](); return; }
    }
    if ((e.key === 'Enter' || e.key === ' ') && tg.getAttribute('role') === 'button' && tg.tagName === 'A') { e.preventDefault(); tg.click(); }
  });
  function openSearch() {
    var d = $('#search-input');
    if (d && d.offsetParent !== null) { d.focus(); return; }
    if ($('.app-header')) { S.ui.pop = 'search'; S.ui.popJustOpened = true; S.ui.returnFocus = 'btn-msearch'; rerender(); }
  }
  window.addEventListener('hashchange', function () { render(true); });
  var mq = window.matchMedia ? window.matchMedia('(min-width: 900px)') : null;
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (S.ui.drawer) { S.ui.drawer = false; rerender(); } });

  /* ------------------------------------------------------------------ boot */
  render(true);
})();
</script>
