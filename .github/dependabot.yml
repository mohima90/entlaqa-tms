# Monthly dependency updates (PO, 20 Oct 2026: monthly instead of weekly; Development Plan §5.3, §8.3
# supply chain). Security is not left to these PRs: gate 11 scans every PR and GitHub raises security
# alerts. Every update is a PR that must pass all CI gates; Claude checks it, the PO merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Asia/Riyadh
    open-pull-requests-limit: 10
    ignore:
      # Node.js 24 LTS is the runtime (.nvmrc, ADR 0001): its type definitions must stay on the same
      # major. Major Node upgrades are a deliberate change (runtime + CI + Vercel), not a Dependabot PR.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # One combined pull request per month for every minor/patch update (PO request, 4 Oct 2026: fewer,
    # bigger updates). Major versions still come one by one — they need a deliberate look.
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels: ['dependencies']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Asia/Riyadh
    groups:
      actions:
        patterns: ['*']
    labels: ['dependencies', 'ci']
  # Self-hosted stack images (T-M1-D04): Dockerfile base image and the digest-pinned compose images.
  # Each bump re-runs gate 15 (whole stack + sign-in + image scan) before the PO merges.
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Asia/Riyadh
    groups:
      images:
        patterns: ['*']
    labels: ['dependencies']
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Asia/Riyadh
    # Database major versions are a deliberate migration (pg_upgrade of customer data; must match the
    # hosted Supabase major and CI), never a Dependabot bump. Minor/patch updates still come (PR #29
    # tried postgres 17 → 18 and was closed by the PO, 5 Oct 2026).
    ignore:
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
      - dependency-name: 'supabase/postgres'
        update-types: ['version-update:semver-major']
    groups:
      images:
        patterns: ['*']
    labels: ['dependencies']
