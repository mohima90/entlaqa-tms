# Supabase CLI configuration for LOCAL development (`supabase start`) — minimal.
# Hosted projects are configured in the dashboard; self-hosted stacks via GoTrue env (T-M1-D04).
# No secrets in this file.
project_id = "jadarat-tms"

[api]
# ADR 0002 §5 / ADR 0003 §4: no Data API (PostgREST / pg_graphql). Server code reaches tenant data only
# through a direct connection (withUserTx); the browser uses Supabase only for Realtime. Auth, Storage and
# Realtime do not need PostgREST. Nothing is exposed — not even `public` (catalog test: public is empty).
# Enforced by `pnpm check:migrations` (scripts/lib/supabase-config.mjs).
enabled = false
port = 54321
schemas = []
extra_search_path = ["extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Align with the staging project's major version once it exists (T-M0-07); CI tests run on 16.
major_version = 16

[db.seed]
# Synthetic seed data only (migration-conventions.md §7); none yet.
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
# ADR 0003 §2: short-lived access tokens with refresh-token rotation and reuse detection.
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Accounts are created by invitation only (FR-IAM-03).
enable_signup = false
# TODO(T-M1-D03): asymmetric signing keys for getClaims() (`supabase gen signing-key`), path kept out of git.

[auth.email]
enable_signup = false
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# ADR 0002 §3: adds tenant_id/person_id for the session's active tenant (migration 20260930120400).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/custom_access_token_hook"
