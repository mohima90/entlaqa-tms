# Gate 15 · Self-hosted (sovereign) stack — once a day at 23:59 Riyadh time (20:59 UTC), not on every
# pull request (PO decision, 14 Oct 2026). Also runnable by hand (Actions → Self-hosted nightly → Run
# workflow), e.g. before a release or after a change to infra/docker. A failure opens (or comments on) an
# issue labelled `selfhosted-nightly`, so it is seen the next morning and fixed before more work lands.
name: Self-hosted nightly

on:
  schedule:
    - cron: '59 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhosted-nightly
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  FORCE_COLOR: '1'

jobs:
  selfhosted:
    name: 'Gate 15 · Self-hosted (sovereign) stack: Postgres + Auth + Storage + ClamAV + app + worker containers, sign-in, files, image scan'
    runs-on: ubuntu-24.04
    # 40: the file journey (T-M2-18) adds ClamAV's signature loading (twice: the fail-closed check restarts
    # it) and two more third-party images to pull and report.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: PostgreSQL client + Playwright Chromium
        run: |
          if ! command -v psql >/dev/null; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          pnpm --filter @jadarat/suite exec playwright install --with-deps chromium
      # T-M1-D04: the whole stack from infra/docker (images pinned by digest), migrations via the
      # production deploy script, real browser sign-in against the app container, audit + TLS checks.
      - run: bash infra/docker/smoke.sh
      # Our images (app, worker) must carry no fixable HIGH/CRITICAL vulnerability.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: jadarat/suite:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: jadarat/worker:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Third-party images (report only; patching tracked as risk R-56)
        if: always()
        run: |
          for image in $(grep -oE 'image: [^ ]+@sha256:[0-9a-f]+' infra/docker/compose.yaml | cut -d' ' -f2); do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
              image --severity HIGH,CRITICAL --ignore-unfixed \
              --scanners vuln --quiet --exit-code 0 "$image" || true
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: selfhosted-playwright-report
          path: |
            apps/suite/playwright-report
            apps/suite/test-results
          retention-days: 14

  report:
    name: Report a failed nightly run
    needs: selfhosted
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          body="Gate 15 (self-hosted stack) failed on \`${SHA}\`: ${RUN_URL}"
          gh label create selfhosted-nightly --color B5440B --description 'Nightly self-hosted run failed' 2>/dev/null || true
          issue="$(gh issue list --label selfhosted-nightly --state open --json number --jq '.[0].number')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title 'Nightly self-hosted run failed' --label selfhosted-nightly --body "$body"
          fi
