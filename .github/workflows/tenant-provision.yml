# Creates an organization (tenant) and makes an existing Auth user its first ACTIVE member (T-M1-D03;
# runbook: docs/engineering/staging-sign-in.md). Manual only.
# Uses the same GitHub environment as "DB deploy" (secret DATABASE_URL, variable DATABASE_CA_CERT); its
# "Deployment branches" rule (main only) is the actual access control.
# Inputs are organization data and a user UID only — never an e-mail or a person's name (run inputs are
# visible to everyone with read access to the repository).
# `staging` (the old project) stays selectable only until it is deleted (production-setup.md step 39, T-M2-36).
# The script also takes the deploy lock (scripts/lib/db-connect.sh § Deploy lock; waits up to 16 minutes), so
# it never runs next to an automatic deploy (which has its own concurrency group).
# Run `plan` first (dry run, always rolled back), then `apply`.
name: Provision organization

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [production, staging]
        default: production
      mode:
        description: 'plan = dry run (rolled back) · apply = create it'
        type: choice
        options: [plan, apply]
        default: plan
      tenant_slug:
        description: 'Organization short name: lowercase letters, digits, hyphens (e.g. entlaqa-demo)'
        type: string
        required: true
      tenant_name_ar:
        description: Organization name in Arabic
        type: string
        required: true
      tenant_name_en:
        description: Organization name in English (optional)
        type: string
        required: false
        default: ''
      admin_user_id:
        description: "The user's UID (Supabase → Authentication → Users → the user → Copy UID)"
        type: string
        required: true
      add_to_existing:
        description: 'Add this user to an organization that already exists (the names must match exactly)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Worker-kick guard (security review H1, 21 Oct 2026; docs/engineering/background-jobs.md §1a): the web
  # app's GitHub App (repository variable JOBS_KICK_ACTOR = its bot login, e.g. jadarat-jobs-kick[bot]) may
  # start, cancel and re-run workflows of this repository. It may run Jobs only: every job here refuses a run
  # whose triggering actor is that App (any event, re-runs included) and a MANUAL start (workflow_dispatch) by
  # any bot; Dependabot's pull-request runs and schedules are unaffected, and with JOBS_KICK_ACTOR unset the
  # PO and Claude still run it by hand. The job below makes a refused run fail visibly.
  refuse-bot-start:
    name: Refuse a start by the worker-kick app or another bot
    if: github.triggering_actor == vars.JOBS_KICK_ACTOR || (github.event_name == 'workflow_dispatch' && endsWith(github.triggering_actor, '[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refused
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "::error::This workflow refuses runs started by the worker-kick app or, by hand, by any bot ($TRIGGERING_ACTOR, $EVENT_NAME). Only Jobs may be started that way."
          exit 1

  provision:
    name: Provision organization (${{ inputs.mode }} → ${{ inputs.environment }})
    if: (github.ref == 'refs/heads/main') && github.triggering_actor != vars.JOBS_KICK_ACTOR && (github.event_name != 'workflow_dispatch' || !endsWith(github.triggering_actor, '[bot]'))
    runs-on: ubuntu-24.04
    # Up to 16 minutes waiting for the deploy lock, plus the run.
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          psql --version
      - name: Check required secrets are configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET: ${{ inputs.environment }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Secret DATABASE_URL is missing in environment '$TARGET' (docs/engineering/db-deploy.md)"
            exit 1
          fi
      # Inputs reach the script as environment variables only (never interpolated into the shell script).
      - name: Provision (${{ inputs.mode }})
        run: bash scripts/provision-tenant.sh "$MODE"
        env:
          MODE: ${{ inputs.mode }}
          TENANT_SLUG: ${{ inputs.tenant_slug }}
          TENANT_NAME_AR: ${{ inputs.tenant_name_ar }}
          TENANT_NAME_EN: ${{ inputs.tenant_name_en }}
          ADMIN_USER_ID: ${{ inputs.admin_user_id }}
          ADD_TO_EXISTING: ${{ inputs.add_to_existing }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT: ${{ vars.DATABASE_CA_CERT }}
