# Serves Supabase Auth's e-mail templates (supabase/templates/*.html, T-M2-08) to the Auth server, which
# reads them by URL (GOTRUE_MAILER_TEMPLATES_*). Plain HTTP on the internal auth-internal network only;
# nothing else is served. Auth starts only once this container is healthy: if a template cannot be read,
# Auth falls back to its own English default (logged as `template_body_http_error`), whose link does not
# fit our reset page.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  types { text/html html; }
  charset utf-8;
  server {
    listen 8080;
    root /srv/templates;
    location = /recovery.html { }
    location = /password-changed.html { }
    location / { return 404; }
  }
}
