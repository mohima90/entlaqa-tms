# TLS gateway in front of the Auth server, mirroring Supabase's URL layout (/auth/v1/…) so the app's
# Supabase client works unchanged. The app reaches it as https://gateway:8443 (private CA). Port 8443 serves
# NO admin path (/auth/v1/admin/…, /auth/v1/invite): Auth's admin API is on port 8444 only, not published,
# for two internal networks — auth-admin (the workers: password-reset links, account bans) and auth-tools
# (the operators' admin-cli: creating users) — T-M2-17 security review, T-M2-09. Port 8100 serves the GlitchTip UI over
# TLS (GlitchTip itself has no route out of the installation).
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Password reset (T-M2-08): Auth's /verify also accepts the 6-digit e-mail code, and self-hosted Auth has
  # no per-client limit without a trusted client-IP header (docs/engineering/password-reset.md). Limit it
  # per source address here. The app's own calls share the app's address: 30 a minute is far above its
  # reset volume.
  limit_req_zone $binary_remote_addr zone=auth_verify:1m rate=30r/m;
  limit_req_status 429;
  server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Prefix match (`^~`), not `=`: Auth's router also serves /verify/ (security review M). proxy_pass
    # with a URI replaces the matched prefix: /auth/v1/verify/… → /verify/…, the query string is kept.
    location ^~ /auth/v1/verify {
      limit_req zone=auth_verify burst=10 nodelay;
      proxy_pass http://auth:9999/verify;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    # Auth's public endpoints that e-mail recovery or sign-in tokens (T-M2-17): unused — the worker creates
    # reset links through the admin API and sends them itself; Auth has no mail relay. Refused here, so
    # nobody can make Auth issue a new recovery token (which would invalidate the link a user was just
    # sent) or tell accounts apart through them.
    location ^~ /auth/v1/recover { return 404; }
    location ^~ /auth/v1/otp { return 404; }
    location ^~ /auth/v1/magiclink { return 404; }
    location ^~ /auth/v1/resend { return 404; }
    # Auth's admin API (and /invite, which needs an admin key) is never served here — not to the app, not
    # through the published port: only on 8444 below (security review T-M2-17).
    location ^~ /auth/v1/admin { return 404; }
    location ^~ /auth/v1/invite { return 404; }
    location /auth/v1/ {
      proxy_pass http://auth:9999/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
  }
  # Auth's admin API, by source network (compose.yaml fixes both subnets; change them together). Not
  # published to the host; every other source address — the app on `edge`, GlitchTip on `errors`, the host
  # through a bridge (each bridge's own .1/.17 address) — is refused. Exactly three calls, each for one
  # network. The workers (auth-admin, 10.231.0.0/28): recovery links (POST /admin/generate_link;
  # generate_link can also ask for signup/magic-link links, but every user creation still passes Auth's
  # sign-up hook, which admits only a valid invitation) and account bans (T-M2-09: PUT /admin/users/{id},
  # one account by its id; the worker sends only `ban_duration` — residual power below) — no listing,
  # creating or deleting users, no factors, no invitations. The operators' admin-cli (auth-tools,
  # 10.231.0.16/28): creating a confirmed user (POST /admin/users). Callers still need a service_role token.
  #
  # Residual power of the workers' token (T-M2-09): nginx cannot read the JSON body, so PUT /admin/users/{id}
  # would accept other attributes too — password, phone, metadata, `role` (the app then refuses that
  # account: it accepts only role `authenticated`), ban or unban of any account it knows the id of.
  # Changing an address is refused by the database (trigger private.refuse_auth_email_change). No new takeover
  # path: the same token already obtains a recovery link — a session — for any account (generate_link).
  # The token lives 90 days, only in the worker containers; the account ids it acts on come from the
  # database's ban queue.
  server {
    listen 8444 ssl;
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    deny 10.231.0.1;
    deny 10.231.0.17;
    allow 10.231.0.0/27;
    deny all;
    location = /auth/v1/admin/generate_link {
      deny 10.231.0.1;
      allow 10.231.0.0/28;
      deny all;
      limit_except POST { deny all; }
      proxy_pass http://auth:9999/admin/generate_link;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      # The method is the request's own (POST, checked above): no override header reaches Auth.
      proxy_set_header X-HTTP-Method-Override "";
      proxy_set_header X-HTTP-Method "";
      proxy_set_header X-Method-Override "";
    }
    # One account by its id (lower-case UUID, the whole normalised path): PUT only — no GET (reading the
    # account), no DELETE, no /factors. The rewrite drops the query string; proxy_pass takes the rewritten
    # path as it is.
    location ~ "^/auth/v1/admin/users/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
      deny 10.231.0.1;
      allow 10.231.0.0/28;
      deny all;
      limit_except PUT { deny all; }
      client_max_body_size 1k;
      rewrite "^/auth/v1/admin/users/([0-9a-f-]{36})$" /admin/users/$1? break;
      proxy_pass http://auth:9999;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      # The method is the request's own (PUT, checked above): no override header reaches Auth.
      proxy_set_header X-HTTP-Method-Override "";
      proxy_set_header X-HTTP-Method "";
      proxy_set_header X-Method-Override "";
    }
    location = /auth/v1/admin/users {
      deny 10.231.0.17;
      allow 10.231.0.16/28;
      deny all;
      limit_except POST { deny all; }
      proxy_pass http://auth:9999/admin/users;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      # The method is the request's own (POST, checked above): no override header reaches Auth.
      proxy_set_header X-HTTP-Method-Override "";
      proxy_set_header X-HTTP-Method "";
      proxy_set_header X-Method-Override "";
    }
    location / { return 404; }
  }
  server {
    listen 8100 ssl;
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    # Resolved per request (Docker DNS), so the gateway also starts when GlitchTip is not running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $glitchtip http://glitchtip:8000;
    location / {
      proxy_pass $glitchtip;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
  # Container health check only (loopback inside the container; not published).
  server {
    listen 127.0.0.1:8081;
    location = /healthz { return 200 'ok'; }
  }
}
