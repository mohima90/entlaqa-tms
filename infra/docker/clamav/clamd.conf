# clamd for the self-hosted stack (ADR 0006 §8, T-M2-18). Mounted read-only; the container runs clamd as
# the image's unprivileged clamav user (uid 1000) with a read-only filesystem. TCP only, on the internal
# `scan` network (workers ⇄ clamd); no local socket, no PID file.
Foreground yes
LogTime yes
LogClean no
ExtendedDetectionInfo yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
MaxThreads 4
MaxConnectionQueueLength 30
ReadTimeout 120
CommandReadTimeout 30

# Limits above the largest purpose (materials, 200 MB; ADR 0006 §1) — clamd's defaults are far lower and
# would stop the stream early. The archive limits stop zip bombs (DOCX/PPTX/XLSX are ZIP containers).
StreamMaxLength 210M
MaxFileSize 210M
MaxScanSize 400M
MaxRecursion 16
MaxFiles 10000
MaxEmbeddedPE 40M
MaxHTMLNormalize 40M
MaxScriptNormalize 20M
# At most 90 s per file (milliseconds; clamd's default is 120 s): past it the scan stops with the finding
# Heuristics.Limits.Exceeded.MaxScanTime (AlertExceedsMax below) — `unscannable`, never clean. The worker
# waits 150 s for a verdict (CLAMD_VERDICT_TIMEOUT_MS, packages/platform-files/src/jobs/clamd.ts): change
# both together, the worker's always longer.
MaxScanTime 90000

# Fail closed: reaching a limit is reported as a finding (Heuristics.Limits.Exceeded.*) instead of "OK", so
# a file is never clean because the scanner stopped looking (the worker records it as rejected,
# `unscannable`, with a low-severity audit event). Encrypted archives cannot be looked into: a finding too
# (Heuristics.Encrypted.*: rejected, `encrypted`, low-severity audit event — not malware). Encrypted PDFs
# and Office documents (AlertEncryptedDoc) follow when a purpose accepts PDFs (backlog).
AlertExceedsMax yes
HeuristicAlerts yes
AlertEncryptedArchive yes

# New signatures written by freshclam into the shared database volume are loaded within 10 minutes.
SelfCheck 600
ConcurrentDatabaseReload yes
